, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 118.0 870.9)">    if root.left == NULL: return root.right</text><text x="118.0" y="904.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 118.0 904.4)">    if root.right == NULL: return root.left</text><text x="119.3" y="937.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 119.3 937.8)">    s = minNode(root.right)  // successor</text><text x="115.9" y="974.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 115.9 974.2)">    root.key = s.key</text><text x="118.1" y="1006.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 118.1 1006.1)">    root.right = delete(root.right, s.key)</text><text x="118.7" y="1041.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 118.7 1041.6)">  return root</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
