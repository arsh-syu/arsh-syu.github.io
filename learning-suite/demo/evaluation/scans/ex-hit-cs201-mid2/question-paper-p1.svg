<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">HIT</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">EST. 1998</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">HORIZON INSTITUTE OF TECHNOLOGY, BENGALURU</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Department of Computer Science &amp; Engineering</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">Mid-Semester Test 2 — October 2026</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">B.Tech CSE · Semester 3 · CS201 Data Structures</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 1½ hours</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 30</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  Answer all questions. Pseudo-code may be written in any C-like notation.</text><text x="52" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Show intermediate states (tree / queue / stack / distance table) wherever asked.</text><text x="52" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">3.  Assume adjacency lists are sorted alphabetically unless stated otherwise.</text><rect x="40" y="303" width="770" height="28" fill="#f3f4f6"/><text x="425" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">PART A · TREES</text><text x="44" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Insert the keys 50, 30, 70, 20, 40, 60, 80, 35 (in this order) into an empty binary</text><text x="76" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">search tree. Draw the final tree and write its inorder and preorder traversals.</text><text x="806" y="378" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="44" y="417" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="417" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Write pseudo-code to delete a node with key k from a BST. Clearly explain how the</text><text x="76" y="438" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">case of a node with two children is handled.</text><text x="806" y="438" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><rect x="40" y="467" width="770" height="28" fill="#f3f4f6"/><text x="425" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">PART B · GRAPHS</text><text x="44" y="521" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="521" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">For the undirected graph with edges A–B, A–C, B–D, C–D, C–E, D–F, E–F, perform BFS</text><text x="76" y="542" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">and DFS starting from vertex A. Show the queue for BFS.</text><text x="806" y="542" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><text x="44" y="581" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="581" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Apply Dijkstra's algorithm on the weighted graph S–A (4), S–B (1), B–A (2), A–C (1),</text><text x="76" y="602" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">B–C (5), C–D (3) with source S. Show the distance table after each step.</text><text x="806" y="602" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><rect x="40" y="631" width="770" height="28" fill="#f3f4f6"/><text x="425" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">PART C · STACKS</text><text x="44" y="685" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="685" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Convert the infix expression A + B * (C − D) / E to postfix using a stack. Show the</text><text x="76" y="706" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">stack and output after each symbol.</text><text x="806" y="706" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[7]</text><text x="425" y="755" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>