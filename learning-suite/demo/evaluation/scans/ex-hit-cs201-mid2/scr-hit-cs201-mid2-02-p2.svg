nk Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 119.0 881.0)">E      | + /     | A B C D − * E</text><text x="117.1" y="915.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 117.1 915.6)">Postfix: A B C D − * E / +</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
