ght="54" fill="#111"/><rect x="705.0" y="116" width="3" height="54" fill="#111"/><rect x="710.0" y="116" width="1" height="54" fill="#111"/><rect x="717.0" y="116" width="1" height="54" fill="#111"/><rect x="724.0" y="116" width="3" height="54" fill="#111"/><rect x="731.0" y="116" width="2" height="54" fill="#111"/><rect x="735.0" y="116" width="2" height="54" fill="#111"/><rect x="740.0" y="116" width="2" height="54" fill="#111"/><rect x="744.0" y="116" width="2" height="54" fill="#111"/><rect x="748.0" y="116" width="3" height="54" fill="#111"/><rect x="753.0" y="116" width="2" height="54" fill="#111"/><rect x="765.0" y="116" width="1" height="54" fill="#111"/><rect x="771.0" y="116" width="2" height="54" fill="#111"/><rect x="778.0" y="116" width="3" height="54" fill="#111"/><rect x="786.0" y="116" width="1" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-UT3-M-0220</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="118.7" y="294.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.38 118.7 294.3)">sin A = 3/4 = P/H; let P = 3k, H = 4k</text><text x="42.6" y="294.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q1.</text><text x="113.5" y="327.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.29 113.5 327.5)">B = √(16k² − 9k²) = √7 k</text><text x="113.4" y="362.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 113.4 362.3)">cos A = B/H = √7/4</text><text x="118.5" y="394.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.27 118.5 394.3)">tan A = P/B = 3/√7</text><text x="116.7" y="462.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 116.7 462.0)">cos 60° = 1/2, sec 30° = 2/√3, tan 45° = 1</text><text x="43.8" y="462.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q2.</text><text x="115.8" y="497.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 115.8 497.5)">Num = 5(1/4) + 4(4/3) − 1</text><text x="112.1" y="531.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 112.1 531.9)">= (15 + 64 − 12)/12 = 67/12</text><text x="117.4" y="564.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 117.4 564.3)">Den = 1/4 + 3/4 = 1</text><text x="112.7" y="599.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 112.7 599.0)">Value = 67/12</text><text x="112.2" y="668.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 112.2 668.3)">LHS = (1/cos A − sin A/cos A)²</text><text x="40.9" y="668.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q3.</text><text x="115.9" y="701.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 115.9 701.2)">= (1 − sin A)² / cos²A</text><text x="114.0" y="733.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 114.0 733.7)">= (1 − sin A)² / (1 − sin²A)</text><text x="113.4" y="769.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 113.4 769.2)">= (1 − sin A)² / [(1 − sin A)(1 + sin A)]</text><text x="119.4" y="803.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 119.4 803.7)">= (1 − sin A)/(1 + sin A) = RHS. Hence proved.</text><text x="116.5" y="869.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 116.5 869.5)">tan 60° = h/30</text><text x="40.5" y="869.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q4.</text><text x="114.2" y="903.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.22 114.2 903.6)">h = 30√3</text><text x="118.2" y="940.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 118.2 940.3)">= 51.96</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
