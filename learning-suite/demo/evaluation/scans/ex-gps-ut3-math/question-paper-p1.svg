<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">GPS</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">EST. 1998</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">GREENFIELD PUBLIC SCHOOL, PUNE</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Affiliated to CBSE, New Delhi · Affiliation No. 1130457</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">Unit Test 3 · 2026-27</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">Class X · Mathematics (Standard) · Ch 8 &amp; 9 Trigonometry</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 50 minutes</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 20</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  All questions are compulsory. Take √3 = 1.732 wherever required.</text><text x="52" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Draw neat figures for heights-and-distances questions.</text><rect x="40" y="284" width="770" height="28" fill="#f3f4f6"/><text x="425" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · 3 MARKS EACH</text><text x="44" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">If sin A = 3/4, calculate cos A and tan A.</text><text x="806" y="338" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><text x="44" y="377" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="377" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Evaluate: (5cos²60° + 4sec²30° − tan²45°) / (sin²30° + cos²30°).</text><text x="806" y="377" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><rect x="40" y="406" width="770" height="28" fill="#f3f4f6"/><text x="425" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · 4 MARKS</text><text x="44" y="460" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="460" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Prove that (sec A − tan A)² = (1 − sin A)/(1 + sin A).</text><text x="806" y="460" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><rect x="40" y="489" width="770" height="28" fill="#f3f4f6"/><text x="425" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION C · 5 MARKS EACH</text><text x="44" y="543" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="543" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">A tower stands vertically on level ground. From a point 30 m from its foot, the</text><text x="76" y="564" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">angle of elevation of the top of the tower is 60°. Find the height of the tower.</text><text x="806" y="564" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="44" y="603" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="603" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">From the top of a 7 m high building, the angle of elevation of the top of a cable</text><text x="76" y="624" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">tower is 60° and the angle of depression of its foot is 45°. Determine the height of</text><text x="76" y="645" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">the tower.</text><text x="806" y="645" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="425" y="694" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>