 Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 114.9 328.2)">cos A = √7/4</text><text x="112.0" y="362.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 112.0 362.3)">tan A = √7/3</text><text x="119.4" y="429.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 119.4 429.3)">sec 30° = √3/2</text><text x="41.7" y="429.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q2.</text><text x="113.7" y="464.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 113.7 464.2)">= 5/4 + 3 − 1 = 13/4</text><text x="116.1" y="495.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 116.1 495.9)">Value = 13/4</text><text x="116.0" y="563.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.48 116.0 563.8)">LHS = ((1 − sin A)/cos A)²</text><text x="41.5" y="563.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q3.</text><text x="119.7" y="598.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 119.7 598.1)">= (1 − sin A)²/cos²A</text><text x="112.8" y="632.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 112.8 632.5)">= (1 − sin A)/(1 + sin A) = RHS</text><text x="114.1" y="700.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 114.1 700.2)">tan 60° = h/30</text><text x="38.3" y="700.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q4.</text><text x="113.5" y="735.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 113.5 735.5)">h = 30√3</text><text x="117.0" y="767.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 117.0 767.9)">= 51.96</text><text x="114.9" y="836.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 114.9 836.3)">BD = 7/√3</text><text x="42.9" y="836.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q5.</text><text x="114.1" y="869.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 114.1 869.7)">CE = 7/√3 × √3 = 7</text><text x="115.4" y="904.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.00 115.4 904.3)">Height = 14 m</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
