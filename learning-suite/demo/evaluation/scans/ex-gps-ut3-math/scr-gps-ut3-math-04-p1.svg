.9" opacity="0.75"/><line x1="30" y1="1014" x2="820" y2="1014" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="1048" x2="820" y2="1048" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="96" y1="260" x2="96" y2="1070" stroke="#e08a8a" stroke-width="1.3" opacity="0.85"/><line x1="100" y1="260" x2="100" y2="1070" stroke="#e08a8a" stroke-width="0.7" opacity="0.6"/><text x="425" y="58" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="bold" fill="#1f2937" letter-spacing="1">GREENFIELD PUBLIC SCHOOL, PUNE</text><text x="425" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Unit Test 3 · 2026-27 · ANSWER BOOKLET</text><line x1="40" y1="96" x2="810" y2="96" stroke="#374151" stroke-width="1.2"/><text x="44" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Subject:</text><line x1="104.4" y1="135" x2="374" y2="135" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="112" y="129" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">Mathematics (041)</text><text x="44" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Date of exam:</text><line x1="138.39999999999998" y1="171" x2="374" y2="171" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="140" y="165" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">29/09/2026</text><text x="44" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">No. of pages used:</text><line x1="172.39999999999998" y1="207" x2="374" y2="207" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="190" y="201" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">2</text><text x="44" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="3" height="54" fill="#111"/><rect x="577.0" y="116" width="3" height="54" fill="#111"/><rect x="582.0" y="116" width="1" height="54" fill="#111"/><rect x="589.0" y="116" width="2" height="54" fill="#111"/><rect x="593.0" y="116" width="1" height="54" fill="#111"/><rect x="596.0" y="116" width="2" height="54" fill="#111"/><rect x="600.0" y="116" width="1" height="54" fill="#111"/><rect x="602.0" y="116" width="1" height="54" fill="#111"/><rect x="605.0" y="116" width="2" height="54" fill="#111"/><rect x="609.0" y="116" width="2" height="54" fill="#111"/><rect x="612.0" y="116" width="3" height="54" fill="#111"/><rect x="618.0" y="116" width="3" height="54" fill="#111"/><rect x="626.0" y="116" width="2" height="54" fill="#111"/><rect x="629.0" y="116" width="3" height="54" fill="#111"/><rect x="634.0" y="116" width="1" height="54" fill="#111"/><rect x="644.0" y="116" width="1" height="54" fill="#111"/><rect x="646.0" y="116" width="3" height="54" fill="#111"/><rect x="663.0" y="116" width="3" height="54" fill="#111"/><rect x="672.0" y="116" width="1" height="54" fill="#111"/><rect x="677.0" y="116" width="2" height="54" fill="#111"/><rect x="680.0" y="116" width="3" height="54" fill="#111"/><rect x="684.0" y="116" width="3" height="54" fill="#111"/><rect x="688.0" y="116" width="2" height="54" fill="#111"/><rect x="695.0" y="116" width="2" height="54" fill="#111"/><rect x="699.0" y="116" width="2" height="54" fill="#111"/><rect x="702.0" y="116" width="3" height="54" fill="#111"/><rect x="706.0" y="116" width="3" height="54" fill="#111"/><rect x="711.0" y="116" width="1" height="54" fill="#111"/><rect x="718.0" y="116" width="1" height="54" fill="#111"/><rect x="725.0" y="116" width="3" height="54" fill="#111"/><rect x="732.0" y="116" width="2" height="54" fill="#111"/><rect x="736.0" y="116" width="2" height="54" fill="#111"/><rect x="741.0" y="116" width="2" height="54" fill="#111"/><rect x="750.0" y="116" width="2" height="54" fill="#111"/><rect x="762.0" y="116" width="1" height="54" fill="#111"/><rect x="768.0" y="116" width="2" height="54" fill="#111"/><rect x="775.0" y="116" width="3" height="54" fill="#111"/><rect x="783.0" y="116" width="1" height="54" fill="#111"/><rect x="786.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-UT3-M-0499</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="116.3" y="293.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 116.3 293.9)">sin A = 3/4 = P/H; let P = 3k, H = 4k</text><text x="40.2" y="293.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q1.</text><text x="119.1" y="327.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 119.1 327.4)">B = √(16k² − 9k²) = √7 k</text><text x="119.4" y="362.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.32 119.4 362.0)">cos A = B/H = √7/4</text><text x="116.8" y="395.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 116.8 395.2)">tan A = P/B = 3/√7</text><text x="114.1" y="462.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 114.1 462.3)">cos 60° = 1/2, sec 30° = 2/√3, tan 45° = 1</text><text x="42.6" y="462.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="118.4" y="497.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 118.4 497.0)">Num = 5(1/4) + 4(4/3) − 1</text><text x="117.1" y="530.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 117.1 530.7)">= (15 + 64 − 12)/12 = 67/12</text><text x="114.6" y="563.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 114.6 563.8)">Den = 1/4 + 3/4 = 1</text><text x="119.3" y="598.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 119.3 598.3)">Value = 67/12</text><text x="113.0" y="665.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 113.0 665.8)">LHS = (1/cos A − sin A/cos A)²</text><text x="39.7" y="665.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="115.7" y="702.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 115.7 702.2)">= (1 − sin A)² / cos²A</text><text x="118.3" y="733.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 118.3 733.8)">= (1 − sin A)² / (1 − sin²A)</text><text x="112.1" y="768.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 112.1 768.2)">= (1 − sin A)² / [(1 − sin A)(1 + sin A)]</text><text x="115.0" y="803.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.13 115.0 803.4)">= (1 − sin A)/(1 + sin A) = RHS. Hence proved.</text><text x="113.0" y="869.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 113.0 869.9)">Let AB = h (tower), BC = 30 m, ∠ACB = 60°</text><text x="40.5" y="869.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="114.5" y="904.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 114.5 904.1)">In △ABC, tan 60° = AB/BC = h/30</text><text x="115.3" y="937.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.08 115.3 937.8)">√3 = h/30 ⇒ h = 30√3 m</text><text x="112.5" y="972.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 112.5 972.2)">h = 30 × 1.732 = 51.96 m</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>