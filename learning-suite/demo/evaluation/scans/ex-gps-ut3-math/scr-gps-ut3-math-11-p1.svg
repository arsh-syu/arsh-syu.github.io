ght="54" fill="#111"/><rect x="702.0" y="116" width="3" height="54" fill="#111"/><rect x="706.0" y="116" width="3" height="54" fill="#111"/><rect x="711.0" y="116" width="1" height="54" fill="#111"/><rect x="718.0" y="116" width="1" height="54" fill="#111"/><rect x="725.0" y="116" width="3" height="54" fill="#111"/><rect x="732.0" y="116" width="2" height="54" fill="#111"/><rect x="736.0" y="116" width="2" height="54" fill="#111"/><rect x="741.0" y="116" width="2" height="54" fill="#111"/><rect x="745.0" y="116" width="3" height="54" fill="#111"/><rect x="753.0" y="116" width="2" height="54" fill="#111"/><rect x="765.0" y="116" width="1" height="54" fill="#111"/><rect x="771.0" y="116" width="2" height="54" fill="#111"/><rect x="778.0" y="116" width="3" height="54" fill="#111"/><rect x="786.0" y="116" width="1" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-UT3-M-0649</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="119.0" y="293.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 119.0 293.6)">B = √(16 − 9) = √7</text><text x="39.0" y="293.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q1.</text><text x="112.3" y="326.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 112.3 326.7)">cos A = √7/4</text><text x="112.6" y="362.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 112.6 362.2)">tan A = √7/3</text><text x="115.0" y="429.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 115.0 429.7)">sec 30° = √3/2</text><text x="43.3" y="429.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="117.5" y="462.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 117.5 462.4)">= 5/4 + 3 − 1 = 13/4</text><text x="115.2" y="496.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 115.2 496.5)">Value = 13/4</text><text x="112.2" y="566.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 112.2 566.3)">LHS = ((1 − sin A)/cos A)²</text><text x="40.6" y="566.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="117.6" y="599.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 117.6 599.3)">= (1 − sin A)²/cos²A</text><text x="115.6" y="633.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.13 115.6 633.1)">= (1 − sin A)/(1 + sin A) = RHS</text><text x="117.8" y="702.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.22 117.8 702.5)">Let AB = h (tower), BC = 30 m, ∠ACB = 60°</text><text x="39.0" y="702.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="116.2" y="735.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 116.2 735.6)">In △ABC, tan 60° = AB/BC = h/30</text><text x="115.8" y="803.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.29 115.8 803.8)">Building AB = 7 m, tower CD, AE ∥ BD</text><text x="40.6" y="803.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="112.4" y="837.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 112.4 837.1)">tan 45° = AB/BD ⇒ BD = 7 m = AE</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
