ght="54" fill="#111"/><rect x="702.0" y="116" width="2" height="54" fill="#111"/><rect x="705.0" y="116" width="3" height="54" fill="#111"/><rect x="710.0" y="116" width="1" height="54" fill="#111"/><rect x="717.0" y="116" width="1" height="54" fill="#111"/><rect x="724.0" y="116" width="3" height="54" fill="#111"/><rect x="731.0" y="116" width="2" height="54" fill="#111"/><rect x="735.0" y="116" width="2" height="54" fill="#111"/><rect x="740.0" y="116" width="2" height="54" fill="#111"/><rect x="744.0" y="116" width="3" height="54" fill="#111"/><rect x="753.0" y="116" width="1" height="54" fill="#111"/><rect x="764.0" y="116" width="1" height="54" fill="#111"/><rect x="770.0" y="116" width="2" height="54" fill="#111"/><rect x="777.0" y="116" width="3" height="54" fill="#111"/><rect x="785.0" y="116" width="1" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-UT3-M-0942</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="118.0" y="293.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 118.0 293.1)">B = √(16 − 9) = √7</text><text x="39.8" y="293.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="116.3" y="326.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 116.3 326.4)">cos A = √7/4</text><text x="117.0" y="360.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 117.0 360.3)">tan A = √7/3</text><text x="116.0" y="428.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.24 116.0 428.3)">cos 60° = 1/2, sec 30° = 2/√3, tan 45° = 1</text><text x="42.5" y="428.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="116.3" y="463.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 116.3 463.5)">= 5/4 + 16/3 − 1 = 69/12</text><text x="117.2" y="495.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 117.2 495.6)">Den = 1 ⇒ value = 69/12</text><text x="115.1" y="564.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.55 115.1 564.2)">LHS = (1/cos A − sin A/cos A)²</text><text x="40.6" y="564.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="114.9" y="600.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 114.9 600.2)">= (1 − sin A)² / cos²A</text><text x="115.8" y="632.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 115.8 632.4)">= (1 − sin A)² / (1 − sin²A)</text><text x="119.3" y="666.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 119.3 666.5)">= (1 − sin A)² / [(1 − sin A)(1 + sin A)]</text><text x="115.9" y="699.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.15 115.9 699.9)">= (1 − sin A)/(1 + sin A) = RHS. Hence proved.</text><text x="118.4" y="769.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 118.4 769.3)">tan 60° = h/30</text><text x="41.9" y="769.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="116.1" y="801.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 116.1 801.8)">h = 30√3</text><text x="116.1" y="836.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 116.1 836.6)">= 51.96</text><text x="113.9" y="905.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 113.9 905.0)">BD = 7 m (tan 45° = 1)</text><text x="38.8" y="905.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q5.</text><text x="118.5" y="938.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 118.5 938.3)">CE = 7√3 m</text><text x="117.4" y="972.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.27 117.4 972.8)">Height of tower = 7√3 m</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
