.9" opacity="0.75"/><line x1="30" y1="1014" x2="820" y2="1014" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="1048" x2="820" y2="1048" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="96" y1="260" x2="96" y2="1070" stroke="#e08a8a" stroke-width="1.3" opacity="0.85"/><line x1="100" y1="260" x2="100" y2="1070" stroke="#e08a8a" stroke-width="0.7" opacity="0.6"/><text x="425" y="58" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="bold" fill="#1f2937" letter-spacing="1">UNIVERSITY OF LUCKNOW (DEMO)</text><text x="425" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">BA (Hons) English III Semester · Sessional Test 2, October 2026 · ANSWER BOOKLET</text><line x1="40" y1="96" x2="810" y2="96" stroke="#374151" stroke-width="1.2"/><text x="44" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Subject:</text><line x1="104.4" y1="135" x2="374" y2="135" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="112" y="129" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">ENG-301 British Poetry and Drama</text><text x="44" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Date of exam:</text><line x1="138.39999999999998" y1="171" x2="374" y2="171" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="140" y="165" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">08/10/2026</text><text x="44" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">No. of pages used:</text><line x1="172.39999999999998" y1="207" x2="374" y2="207" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="190" y="201" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">2</text><text x="44" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="2" height="54" fill="#111"/><rect x="564.0" y="116" width="3" height="54" fill="#111"/><rect x="573.0" y="116" width="3" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="580.0" y="116" width="2" height="54" fill="#111"/><rect x="601.0" y="116" width="2" height="54" fill="#111"/><rect x="604.0" y="116" width="3" height="54" fill="#111"/><rect x="609.0" y="116" width="2" height="54" fill="#111"/><rect x="613.0" y="116" width="2" height="54" fill="#111"/><rect x="620.0" y="116" width="1" height="54" fill="#111"/><rect x="623.0" y="116" width="3" height="54" fill="#111"/><rect x="636.0" y="116" width="3" height="54" fill="#111"/><rect x="652.0" y="116" width="1" height="54" fill="#111"/><rect x="655.0" y="116" width="2" height="54" fill="#111"/><rect x="659.0" y="116" width="3" height="54" fill="#111"/><rect x="664.0" y="116" width="3" height="54" fill="#111"/><rect x="677.0" y="116" width="2" height="54" fill="#111"/><rect x="684.0" y="116" width="3" height="54" fill="#111"/><rect x="688.0" y="116" width="1" height="54" fill="#111"/><rect x="696.0" y="116" width="1" height="54" fill="#111"/><rect x="698.0" y="116" width="2" height="54" fill="#111"/><rect x="701.0" y="116" width="3" height="54" fill="#111"/><rect x="710.0" y="116" width="3" height="54" fill="#111"/><rect x="715.0" y="116" width="2" height="54" fill="#111"/><rect x="719.0" y="116" width="2" height="54" fill="#111"/><rect x="731.0" y="116" width="3" height="54" fill="#111"/><rect x="735.0" y="116" width="2" height="54" fill="#111"/><rect x="739.0" y="116" width="3" height="54" fill="#111"/><rect x="743.0" y="116" width="2" height="54" fill="#111"/><rect x="746.0" y="116" width="2" height="54" fill="#111"/><rect x="750.0" y="116" width="3" height="54" fill="#111"/><rect x="757.0" y="116" width="3" height="54" fill="#111"/><rect x="769.0" y="116" width="3" height="54" fill="#111"/><rect x="774.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0614</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="112.4" y="293.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 112.4 293.3)">Faustus wants more knowledge and power,</text><text x="43.0" y="293.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="118.7" y="326.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 118.7 326.9)">so he makes a pact with Lucifer and falls.</text><text x="112.6" y="360.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 112.6 360.2)">At the end he is afraid of hell and wants time to stop.</text><text x="116.5" y="394.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 116.5 394.4)">The play shows that ambition is dangerous.</text><text x="116.6" y="462.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 116.6 462.2)">Disguise: Viola as Cesario creates the love triangle</text><text x="39.7" y="462.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="115.2" y="497.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 115.2 497.8)">of Orsino, Olivia and Viola.</text><text x="112.9" y="530.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 112.9 530.1)">Gulling: Maria's forged letter makes Malvolio</text><text x="118.6" y="565.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 118.6 565.7)">appear cross-gartered in yellow stockings.</text><text x="113.8" y="598.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 113.8 598.4)">The laughter exposes self-love and folly,</text><text x="112.3" y="631.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 112.3 631.7)">while the mood stays festive.</text><text x="118.6" y="701.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 118.6 701.3)">A conceit is a far-fetched comparison.</text><text x="38.3" y="701.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="116.9" y="735.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 116.9 735.6)">Donne compares two lovers to the legs of a compass.</text><text x="117.5" y="770.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 117.5 770.1)">The fixed leg is the wife who stays at home.</text><text x="115.0" y="804.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 115.0 804.1)">Marvell also uses conceits.</text><text x="112.0" y="871.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.07 112.0 871.9)">The stanza sets the beauty of a perfect day</text><text x="43.6" y="871.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="114.4" y="905.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 114.4 905.6)">against its certain end: all beauty passes.</text><text x="112.8" y="938.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 112.8 938.3)">The day is 'the bridal of the earth and sky' and</text><text x="117.7" y="972.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.02 117.7 972.9)">the dew 'shall weep' for it, a tender conceit.</text><text x="114.9" y="1006.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 114.9 1006.7)">The short last line 'For thou must die' falls</text><text x="113.3" y="1040.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 113.3 1040.9)">like a bell; the tone is calm and grave.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>