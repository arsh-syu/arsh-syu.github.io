<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">LU</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">DEMO</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">UNIVERSITY OF LUCKNOW (DEMO)</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Department of English and Modern European Languages · demo paper</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">BA (Hons) English III Semester · Sessional Test 2, October 2026</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">Paper ENG-301 · British Poetry and Drama (demo paper code)</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 1½ hours</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 30</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  Answer all five questions. Each question carries 6 marks.</text><text x="52" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Refer closely to the prescribed texts. Short quotations may be given from memory.</text><text x="52" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">3.  Write only your masked roll number on the answer book.</text><rect x="40" y="303" width="770" height="28" fill="#f3f4f6"/><text x="425" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · DRAMA</text><text x="44" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Discuss Doctor Faustus as a tragedy of ambition. Refer to Faustus's final soliloquy.</text><text x="806" y="357" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><text x="44" y="396" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="396" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Explain any two comic devices in Shakespeare's Twelfth Night, with examples.</text><text x="806" y="396" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><rect x="40" y="425" width="770" height="28" fill="#f3f4f6"/><text x="425" y="444" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · METAPHYSICAL POETRY</text><text x="44" y="479" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="479" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">What is a metaphysical conceit? Illustrate with the compass image in Donne's 'A</text><text x="76" y="500" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Valediction: Forbidding Mourning' and one example from Marvell.</text><text x="806" y="500" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><text x="44" y="539" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="539" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Write a critical appreciation of the following stanza from George Herbert's</text><text x="76" y="560" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">'Virtue': &quot;Sweet day, so cool, so calm, so bright, / The bridal of the earth and</text><text x="76" y="581" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">sky; / The dew shall weep thy fall to-night, / For thou must die.&quot;</text><text x="806" y="581" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><rect x="40" y="610" width="770" height="28" fill="#f3f4f6"/><text x="425" y="629" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION C · MILTON</text><text x="44" y="664" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="664" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Evaluate Milton's portrayal of Satan in Paradise Lost, Book I. Is Satan the hero of</text><text x="76" y="685" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">the poem?</text><text x="806" y="685" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[6]</text><text x="425" y="734" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>