ill="#111"/><rect x="765.0" y="40" width="3" height="26" fill="#111"/><rect x="769.0" y="40" width="1" height="26" fill="#111"/><rect x="776.0" y="40" width="3" height="26" fill="#111"/><rect x="780.0" y="40" width="2" height="26" fill="#111"/><rect x="783.0" y="40" width="3" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0603</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="119.3" y="133.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 119.3 133.7)">Satan rouses the fallen angels with grand rhetoric:</text><text x="38.1" y="133.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q5.</text><text x="115.4" y="167.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 115.4 167.8)">'Better to reign in Hell, than serve in Heaven'.</text><text x="116.1" y="200.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 116.1 200.7)">Yet Milton undercuts him: his courage hides</text><text x="116.9" y="235.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 116.9 235.8)">envy and self-deception, and he shrinks later.</text><text x="118.9" y="269.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 118.9 269.7)">He is the most vivid figure, not the hero;</text><text x="119.6" y="301.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 119.6 301.7)">the poem aims to 'justify the ways of God to men'.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
