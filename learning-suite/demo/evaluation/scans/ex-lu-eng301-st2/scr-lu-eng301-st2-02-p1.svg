"54" fill="#111"/><rect x="722.0" y="116" width="2" height="54" fill="#111"/><rect x="734.0" y="116" width="3" height="54" fill="#111"/><rect x="738.0" y="116" width="2" height="54" fill="#111"/><rect x="742.0" y="116" width="3" height="54" fill="#111"/><rect x="746.0" y="116" width="2" height="54" fill="#111"/><rect x="749.0" y="116" width="2" height="54" fill="#111"/><rect x="753.0" y="116" width="3" height="54" fill="#111"/><rect x="770.0" y="116" width="3" height="54" fill="#111"/><rect x="775.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0677</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="116.2" y="293.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 116.2 293.8)">Faustus rejects the limits of human learning</text><text x="38.6" y="293.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q1.</text><text x="112.4" y="326.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.26 112.4 326.6)">and sells his soul for power: a tragic rise and fall.</text><text x="115.7" y="360.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 115.7 360.9)">In the final soliloquy time itself turns against him:</text><text x="116.6" y="394.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 116.6 394.9)">'Now hast thou but one bare hour to live'.</text><text x="118.3" y="428.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 118.3 428.2)">He is the Renaissance overreacher, yet the play</text><text x="116.0" y="463.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 116.0 463.2)">keeps the morality frame of sin and damnation.</text><text x="113.4" y="531.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 113.4 531.9)">Disguise: Viola as Cesario creates the love triangle</text><text x="38.7" y="531.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="118.8" y="564.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 118.8 564.0)">of Orsino, Olivia and Viola.</text><text x="113.2" y="598.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 113.2 598.1)">Gulling: Maria's forged letter makes Malvolio</text><text x="114.0" y="632.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 114.0 632.3)">appear cross-gartered in yellow stockings.</text><text x="118.7" y="666.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 118.7 666.6)">The laughter exposes self-love and folly,</text><text x="117.8" y="700.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 117.8 700.8)">while the mood stays festive.</text><text x="116.3" y="768.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 116.3 768.8)">A conceit is an extended, startling comparison</text><text x="41.8" y="768.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="117.2" y="804.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 117.2 804.1)">that links unlike things through argument.</text><text x="117.9" y="838.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 117.9 838.2)">Donne's lovers are 'twin compasses': the fixed</text><text x="118.0" y="870.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 118.0 870.3)">foot keeps the moving foot's circle 'just'.</text><text x="114.5" y="906.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 114.5 906.2)">Marvell's 'vegetable love' grows 'vaster than empires'</text><text x="114.5" y="939.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.10 114.5 939.4)">to mock slow courtship in 'To His Coy Mistress'.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
