"54" fill="#111"/><rect x="719.0" y="116" width="2" height="54" fill="#111"/><rect x="731.0" y="116" width="3" height="54" fill="#111"/><rect x="735.0" y="116" width="2" height="54" fill="#111"/><rect x="739.0" y="116" width="3" height="54" fill="#111"/><rect x="743.0" y="116" width="2" height="54" fill="#111"/><rect x="746.0" y="116" width="2" height="54" fill="#111"/><rect x="750.0" y="116" width="3" height="54" fill="#111"/><rect x="757.0" y="116" width="1" height="54" fill="#111"/><rect x="768.0" y="116" width="3" height="54" fill="#111"/><rect x="773.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0653</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="118.7" y="291.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.24 118.7 291.7)">Faustus wants more knowledge and power,</text><text x="40.9" y="291.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="116.6" y="327.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 116.6 327.0)">so he makes a pact with Lucifer and falls.</text><text x="116.0" y="361.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 116.0 361.9)">At the end he is afraid of hell and wants time to stop.</text><text x="112.6" y="395.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 112.6 395.3)">The play shows that ambition is dangerous.</text><text x="117.8" y="463.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 117.8 463.5)">Viola dresses as a man, Cesario, and Olivia</text><text x="41.6" y="463.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="115.5" y="496.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 115.5 496.3)">falls in love with her.</text><text x="112.3" y="531.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 112.3 531.7)">Malvolio is tricked with a letter.</text><text x="112.0" y="565.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 112.0 565.2)">These make the audience laugh.</text><text x="117.8" y="632.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 117.8 632.6)">A conceit is an extended, startling comparison</text><text x="42.6" y="632.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="115.0" y="667.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 115.0 667.7)">that links unlike things through argument.</text><text x="113.1" y="736.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 113.1 736.1)">The stanza sets the beauty of a perfect day</text><text x="39.7" y="736.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="113.2" y="770.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 113.2 770.4)">against its certain end: all beauty passes.</text><text x="118.3" y="836.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 118.3 836.6)">Satan is the devil and is evil.</text><text x="43.1" y="836.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q5.</text><text x="112.1" y="872.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 112.1 872.0)">He is not the hero because he is bad.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
