.9" opacity="0.75"/><line x1="30" y1="1014" x2="820" y2="1014" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="1048" x2="820" y2="1048" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="96" y1="260" x2="96" y2="1070" stroke="#e08a8a" stroke-width="1.3" opacity="0.85"/><line x1="100" y1="260" x2="100" y2="1070" stroke="#e08a8a" stroke-width="0.7" opacity="0.6"/><text x="425" y="58" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="bold" fill="#1f2937" letter-spacing="1">UNIVERSITY OF LUCKNOW (DEMO)</text><text x="425" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">BA (Hons) English III Semester · Sessional Test 2, October 2026 · ANSWER BOOKLET</text><line x1="40" y1="96" x2="810" y2="96" stroke="#374151" stroke-width="1.2"/><text x="44" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Subject:</text><line x1="104.4" y1="135" x2="374" y2="135" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="112" y="129" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">ENG-301 British Poetry and Drama</text><text x="44" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Date of exam:</text><line x1="138.39999999999998" y1="171" x2="374" y2="171" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="140" y="165" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">08/10/2026</text><text x="44" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">No. of pages used:</text><line x1="172.39999999999998" y1="207" x2="374" y2="207" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="190" y="201" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1d3a8f">2</text><text x="44" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="2" height="54" fill="#111"/><rect x="564.0" y="116" width="3" height="54" fill="#111"/><rect x="573.0" y="116" width="3" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="580.0" y="116" width="2" height="54" fill="#111"/><rect x="601.0" y="116" width="2" height="54" fill="#111"/><rect x="604.0" y="116" width="3" height="54" fill="#111"/><rect x="609.0" y="116" width="2" height="54" fill="#111"/><rect x="613.0" y="116" width="2" height="54" fill="#111"/><rect x="620.0" y="116" width="1" height="54" fill="#111"/><rect x="623.0" y="116" width="2" height="54" fill="#111"/><rect x="637.0" y="116" width="3" height="54" fill="#111"/><rect x="653.0" y="116" width="1" height="54" fill="#111"/><rect x="656.0" y="116" width="2" height="54" fill="#111"/><rect x="660.0" y="116" width="3" height="54" fill="#111"/><rect x="665.0" y="116" width="3" height="54" fill="#111"/><rect x="678.0" y="116" width="2" height="54" fill="#111"/><rect x="685.0" y="116" width="3" height="54" fill="#111"/><rect x="689.0" y="116" width="1" height="54" fill="#111"/><rect x="696.0" y="116" width="3" height="54" fill="#111"/><rect x="700.0" y="116" width="2" height="54" fill="#111"/><rect x="703.0" y="116" width="3" height="54" fill="#111"/><rect x="712.0" y="116" width="3" height="54" fill="#111"/><rect x="717.0" y="116" width="2" height="54" fill="#111"/><rect x="721.0" y="116" width="2" height="54" fill="#111"/><rect x="733.0" y="116" width="3" height="54" fill="#111"/><rect x="737.0" y="116" width="2" height="54" fill="#111"/><rect x="741.0" y="116" width="3" height="54" fill="#111"/><rect x="745.0" y="116" width="2" height="54" fill="#111"/><rect x="748.0" y="116" width="2" height="54" fill="#111"/><rect x="752.0" y="116" width="3" height="54" fill="#111"/><rect x="759.0" y="116" width="2" height="54" fill="#111"/><rect x="772.0" y="116" width="3" height="54" fill="#111"/><rect x="777.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0603</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="114.1" y="293.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 114.1 293.8)">Faustus wants more knowledge and power,</text><text x="42.2" y="293.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="116.2" y="326.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.24 116.2 326.8)">so he makes a pact with Lucifer and falls.</text><text x="117.3" y="361.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.10 117.3 361.5)">At the end he is afraid of hell and wants time to stop.</text><text x="115.9" y="394.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 115.9 394.0)">The play shows that ambition is dangerous.</text><text x="117.0" y="464.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 117.0 464.0)">Disguise: Viola as Cesario creates the love triangle</text><text x="39.8" y="464.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="112.2" y="496.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 112.2 496.6)">of Orsino, Olivia and Viola.</text><text x="114.5" y="529.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 114.5 529.7)">Gulling: Maria's forged letter makes Malvolio</text><text x="118.6" y="566.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.08 118.6 566.2)">appear cross-gartered in yellow stockings.</text><text x="115.0" y="599.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 115.0 599.3)">The laughter exposes self-love and folly,</text><text x="114.9" y="632.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 114.9 632.5)">while the mood stays festive.</text><text x="114.5" y="701.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 114.5 701.0)">A conceit is an extended, startling comparison</text><text x="43.8" y="701.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="119.1" y="736.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 119.1 736.3)">that links unlike things through argument.</text><text x="119.8" y="769.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 119.8 769.9)">Donne's lovers are 'twin compasses': the fixed</text><text x="114.0" y="803.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 114.0 803.7)">foot keeps the moving foot's circle 'just'.</text><text x="113.9" y="836.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 113.9 836.3)">Marvell's 'vegetable love' grows 'vaster than empires'</text><text x="120.0" y="869.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 120.0 869.7)">to mock slow courtship in 'To His Coy Mistress'.</text><text x="118.9" y="937.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 118.9 937.8)">The poet says the day is beautiful but it will end.</text><text x="41.4" y="937.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="119.9" y="973.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 119.9 973.2)">The dew is crying, which is personification.</text><text x="114.2" y="1007.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 114.2 1007.0)">The last line is short.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>