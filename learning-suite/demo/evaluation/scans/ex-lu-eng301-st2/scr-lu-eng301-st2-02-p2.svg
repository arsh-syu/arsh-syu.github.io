.9" opacity="0.75"/><line x1="30" y1="854" x2="820" y2="854" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="888" x2="820" y2="888" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="922" x2="820" y2="922" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="956" x2="820" y2="956" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="990" x2="820" y2="990" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="1024" x2="820" y2="1024" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="96" y1="100" x2="96" y2="1070" stroke="#e08a8a" stroke-width="1.3" opacity="0.85"/><line x1="100" y1="100" x2="100" y2="1070" stroke="#e08a8a" stroke-width="0.7" opacity="0.6"/><text x="44" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">UNIVERSITY OF LUCKNOW (DEMO) · ENG-301 British Poetry and Drama</text><rect x="634" y="34" width="162" height="56" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="640.0" y="40" width="2" height="26" fill="#111"/><rect x="644.0" y="40" width="3" height="26" fill="#111"/><rect x="653.0" y="40" width="3" height="26" fill="#111"/><rect x="657.0" y="40" width="2" height="26" fill="#111"/><rect x="660.0" y="40" width="2" height="26" fill="#111"/><rect x="681.0" y="40" width="2" height="26" fill="#111"/><rect x="684.0" y="40" width="3" height="26" fill="#111"/><rect x="689.0" y="40" width="2" height="26" fill="#111"/><rect x="693.0" y="40" width="2" height="26" fill="#111"/><rect x="700.0" y="40" width="1" height="26" fill="#111"/><rect x="718.0" y="40" width="3" height="26" fill="#111"/><rect x="734.0" y="40" width="1" height="26" fill="#111"/><rect x="737.0" y="40" width="2" height="26" fill="#111"/><rect x="741.0" y="40" width="3" height="26" fill="#111"/><rect x="746.0" y="40" width="3" height="26" fill="#111"/><rect x="759.0" y="40" width="2" height="26" fill="#111"/><rect x="766.0" y="40" width="3" height="26" fill="#111"/><rect x="770.0" y="40" width="1" height="26" fill="#111"/><rect x="773.0" y="40" width="3" height="26" fill="#111"/><rect x="778.0" y="40" width="1" height="26" fill="#111"/><rect x="781.0" y="40" width="2" height="26" fill="#111"/><rect x="784.0" y="40" width="3" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">LU-ST2-ENG301-0677</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="113.0" y="133.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 113.0 133.5)">The stanza sets the beauty of a perfect day</text><text x="39.2" y="133.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="113.1" y="167.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 113.1 167.3)">against its certain end: all beauty passes.</text><text x="119.8" y="200.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 119.8 200.0)">The day is 'the bridal of the earth and sky' and</text><text x="115.8" y="235.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 115.8 235.3)">the dew 'shall weep' for it, a tender conceit.</text><text x="120.0" y="269.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 120.0 269.1)">The short last line 'For thou must die' falls</text><text x="119.9" y="301.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 119.9 301.9)">like a bell; the tone is calm and grave.</text><text x="116.0" y="370.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.55 116.0 370.8)">Satan rouses the fallen angels with grand rhetoric:</text><text x="43.8" y="370.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="116.4" y="406.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 116.4 406.4)">'Better to reign in Hell, than serve in Heaven'.</text><text x="117.8" y="440.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 117.8 440.3)">Yet Milton undercuts him: his courage hides</text><text x="118.3" y="471.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 118.3 471.6)">envy and self-deception, and he shrinks later.</text><text x="113.4" y="506.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 113.4 506.4)">He is the most vivid figure, not the hero;</text><text x="118.4" y="541.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.05 118.4 541.3)">the poem aims to 'justify the ways of God to men'.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>