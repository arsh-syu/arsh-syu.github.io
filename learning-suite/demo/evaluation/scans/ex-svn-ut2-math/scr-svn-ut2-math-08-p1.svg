ht="54" fill="#111"/><rect x="731.0" y="116" width="2" height="54" fill="#111"/><rect x="734.0" y="116" width="3" height="54" fill="#111"/><rect x="739.0" y="116" width="1" height="54" fill="#111"/><rect x="746.0" y="116" width="1" height="54" fill="#111"/><rect x="749.0" y="116" width="3" height="54" fill="#111"/><rect x="754.0" y="116" width="3" height="54" fill="#111"/><rect x="763.0" y="116" width="2" height="54" fill="#111"/><rect x="766.0" y="116" width="2" height="54" fill="#111"/><rect x="771.0" y="116" width="2" height="54" fill="#111"/><rect x="775.0" y="116" width="3" height="54" fill="#111"/><rect x="779.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">SVN-UT2-M9-0595</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="113.9" y="292.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 113.9 292.6)">× (√7 + √6)/(√7 + √6)</text><text x="41.9" y="292.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q1.</text><text x="117.5" y="327.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.48 117.5 327.1)">= (√7 + √6)/(7 + 6) = (√7 + √6)/13</text><text x="112.5" y="393.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 112.5 393.5)">x = −1</text><text x="39.7" y="393.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="116.8" y="429.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 116.8 429.8)">p(−1) = −1 + 3 − 3 + 1</text><text x="112.4" y="462.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 112.4 462.3)">= 1</text><text x="112.2" y="531.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 112.2 531.4)">(a + b)³ identity, a = 2x, b = 3y</text><text x="41.8" y="531.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="117.8" y="564.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 117.8 564.4)">= (2x)³ + (3y)³ + 3(2x)²(3y) + 3(2x)(3y)²</text><text x="115.3" y="599.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 115.3 599.8)">= (2x + 3y)(2x + 3y)</text><text x="115.9" y="667.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 115.9 667.4)">p(1) = 0 ⇒ (x − 1) is a factor</text><text x="39.8" y="667.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="115.6" y="699.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 115.6 699.8)">quotient = x² − 22x + 120</text><text x="116.8" y="734.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 116.8 734.2)">= x² − 12x − 10x + 120</text><text x="112.3" y="767.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 112.3 767.6)">= (x − 1)(x + 10)(x − 12)</text><text x="113.3" y="837.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 113.3 837.0)">2x + y = 7</text><text x="39.0" y="837.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q5.</text><text x="114.8" y="870.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.07 114.8 870.9)">x = 0 ⇒ y = 7 → (0, 7)</text><text x="117.7" y="905.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 117.7 905.3)">x = 2 ⇒ y = 3 → (2, 3)</text><text x="113.3" y="940.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 113.3 940.2)">Graph: a straight line through these points</text><text x="112.4" y="972.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.51 112.4 972.7)">(1, 5): 2(1) + 5 = 7 = RHS ✓</text><text x="116.3" y="1008.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 116.3 1008.3)">∴ (1, 5) is a solution.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
