font-size="13" fill="#374151">2.  Show all steps; step-wise marks will be awarded.</text><rect x="40" y="284" width="770" height="28" fill="#f3f4f6"/><text x="425" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · 2 MARKS</text><text x="44" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Rationalise the denominator of 1/(√7 − √6).</text><text x="806" y="338" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[2]</text><rect x="40" y="367" width="770" height="28" fill="#f3f4f6"/><text x="425" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · 3 MARKS EACH</text><text x="44" y="421" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="421" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the remainder when x³ + 3x² + 3x + 1 is divided by x + 1.</text><text x="806" y="421" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><text x="44" y="460" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="460" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Factorise: 8x³ + 27y³ + 36x²y + 54xy².</text><text x="806" y="460" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><rect x="40" y="489" width="770" height="28" fill="#f3f4f6"/><text x="425" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION C · 4 MARKS EACH</text><text x="44" y="543" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="543" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Using the factor theorem, factorise x³ − 23x² + 142x − 120.</text><text x="806" y="543" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="582" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="582" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">For the linear equation 2x + y = 7, find any two solutions and state what its graph</text><text x="76" y="603" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">looks like. Check whether (1, 5) is a solution.</text><text x="806" y="603" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="642" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">6.</text><text x="76" y="642" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Simplify using the laws of exponents: (i) 9^(3/2) (ii) (1/27)^(−2/3).</text><text x="806" y="642" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="425" y="691" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>