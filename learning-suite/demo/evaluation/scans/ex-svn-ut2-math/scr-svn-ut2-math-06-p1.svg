ht="54" fill="#111"/><rect x="729.0" y="116" width="3" height="54" fill="#111"/><rect x="734.0" y="116" width="1" height="54" fill="#111"/><rect x="741.0" y="116" width="1" height="54" fill="#111"/><rect x="744.0" y="116" width="3" height="54" fill="#111"/><rect x="749.0" y="116" width="3" height="54" fill="#111"/><rect x="758.0" y="116" width="2" height="54" fill="#111"/><rect x="761.0" y="116" width="2" height="54" fill="#111"/><rect x="766.0" y="116" width="2" height="54" fill="#111"/><rect x="770.0" y="116" width="3" height="54" fill="#111"/><rect x="776.0" y="116" width="2" height="54" fill="#111"/><rect x="780.0" y="116" width="3" height="54" fill="#111"/><rect x="785.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">SVN-UT2-M9-0360</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="113.6" y="293.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.21 113.6 293.3)">1/(√7 − √6) × (√7 + √6)/(√7 + √6)</text><text x="40.8" y="293.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q1.</text><text x="117.7" y="328.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 117.7 328.1)">= (√7 + √6)/(7 − 6)</text><text x="119.9" y="361.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 119.9 361.2)">= √7 + √6</text><text x="115.7" y="430.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.47 115.7 430.3)">x = −1</text><text x="41.8" y="430.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="117.2" y="461.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 117.2 461.8)">p(−1) = −1 + 3 − 3 + 1</text><text x="117.6" y="496.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 117.6 496.0)">= 1</text><text x="116.2" y="563.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 116.2 563.5)">(a + b)³ identity, a = 2x, b = 3y</text><text x="41.9" y="563.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="115.9" y="599.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 115.9 599.4)">= (2x)³ + (3y)³ + 3(2x)²(3y) + 3(2x)(3y)²</text><text x="117.7" y="632.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 117.7 632.0)">= (2x + 3y)(2x + 3y)</text><text x="116.3" y="701.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.26 116.3 701.1)">p(1) = 0 ⇒ (x − 1) is a factor</text><text x="39.8" y="701.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="117.9" y="734.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 117.9 734.1)">quotient = x² − 22x + 120</text><text x="119.6" y="768.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 119.6 768.1)">= x² − 12x − 10x + 120</text><text x="116.7" y="803.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.13 116.7 803.4)">= (x − 1)(x + 10)(x − 12)</text><text x="113.8" y="871.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.20 113.8 871.1)">x = 0 ⇒ y = 7 → (0, 7)</text><text x="44.0" y="871.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="113.1" y="903.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 113.1 903.9)">x = 2 ⇒ y = 5 → (2, 5)</text><text x="119.3" y="938.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 119.3 938.3)">Graph is a line.</text><text x="112.2" y="973.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 112.2 973.7)">2 + 5 = 7 ✓ so (1, 5) is a solution</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
