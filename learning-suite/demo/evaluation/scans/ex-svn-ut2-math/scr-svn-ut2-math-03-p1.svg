a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 119.1 666.2)">x² − 22x + 120</text><text x="113.8" y="701.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.00 113.8 701.4)">= (x − 20)(x − 2)</text><text x="114.8" y="770.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 114.8 770.3)">2x + y = 7</text><text x="42.6" y="770.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q5.</text><text x="113.4" y="804.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.29 113.4 804.1)">x = 0 ⇒ y = 7 → (0, 7)</text><text x="119.3" y="836.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 119.3 836.4)">x = 2 ⇒ y = 3 → (2, 3)</text><text x="116.1" y="905.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 116.1 905.3)">(i) 9^(3/2) = 27/2</text><text x="42.7" y="905.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q6.</text><text x="114.7" y="939.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 114.7 939.0)">(ii) (1/27)^(−2/3) = −18</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
