te-space:pre" transform="rotate(0.53 113.8 267.6)">(1, 5): 2(1) + 5 = 7 = RHS ✓</text><text x="116.2" y="302.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 116.2 302.3)">∴ (1, 5) is a solution.</text><text x="119.0" y="371.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 119.0 371.4)">(i) 9^(3/2) = (3²)^(3/2) = 3³</text><text x="41.3" y="371.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q6.</text><text x="114.6" y="406.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 114.6 406.1)">= 27</text><text x="113.4" y="439.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 113.4 439.1)">(ii) (1/27)^(−2/3) = (27)^(2/3)</text><text x="112.6" y="473.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 112.6 473.0)">= (3³)^(2/3) = 3² = 9</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
