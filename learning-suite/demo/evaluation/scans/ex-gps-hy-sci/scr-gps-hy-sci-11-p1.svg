ht="bold" fill="#172554">Q1.</text><text x="116.4" y="327.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 116.4 327.2)">Fe + H₂O → Fe₃O₄ + H₂</text><text x="113.9" y="361.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 113.9 361.5)">Decomposition reaction</text><text x="114.3" y="429.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 114.3 429.1)">Bubbles of gas are formed.</text><text x="42.2" y="429.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q2.</text><text x="115.4" y="463.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.07 115.4 463.8)">Na₂SO₄ + BaCl₂ → BaS + NaCl</text><text x="114.7" y="530.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 114.7 530.0)">Sweets are bad for teeth.</text><text x="40.8" y="530.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q3.</text><text x="113.2" y="565.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 113.2 565.6)">Brush teeth daily.</text><text x="116.1" y="631.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.08 116.1 631.8)">Electrolysis of ZnCO₃ gives zinc.</text><text x="43.7" y="631.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q4.</text><text x="118.8" y="666.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 118.8 666.7)">Carbon is a reducing agent.</text><text x="119.5" y="736.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 119.5 736.3)">Aerobic: with air | Anaerobic: without air</text><text x="40.0" y="736.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q5.</text><text x="112.2" y="768.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.13 112.2 768.5)">Both give CO₂ and water.</text><text x="118.4" y="835.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 118.4 835.8)">(a) R = 10 Ω</text><text x="41.2" y="835.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="118.9" y="871.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 118.9 871.7)">I = V/R = 1.2 A</text><text x="113.1" y="906.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 113.1 906.4)">(b) R = 