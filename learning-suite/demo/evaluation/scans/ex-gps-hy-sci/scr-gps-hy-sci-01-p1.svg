2" height="54" fill="#111"/><rect x="708.0" y="116" width="3" height="54" fill="#111"/><rect x="713.0" y="116" width="2" height="54" fill="#111"/><rect x="722.0" y="116" width="1" height="54" fill="#111"/><rect x="733.0" y="116" width="3" height="54" fill="#111"/><rect x="739.0" y="116" width="2" height="54" fill="#111"/><rect x="743.0" y="116" width="1" height="54" fill="#111"/><rect x="750.0" y="116" width="2" height="54" fill="#111"/><rect x="762.0" y="116" width="3" height="54" fill="#111"/><rect x="766.0" y="116" width="3" height="54" fill="#111"/><rect x="771.0" y="116" width="2" height="54" fill="#111"/><rect x="775.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-S-0316</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="118.7" y="294.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 118.7 294.1)">3Fe + 4H₂O → Fe₃O₄ + 4H₂</text><text x="41.8" y="294.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="118.2" y="328.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 118.2 328.0)">Fe: 3 = 3,  H: 8 = 8,  O: 4 = 4</text><text x="114.8" y="361.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.22 114.8 361.1)">Iron is oxidised, hydrogen is reduced —</text><text x="113.9" y="396.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.50 113.9 396.3)">it is a redox reaction.</text><text x="118.0" y="463.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 118.0 463.7)">A white precipitate of barium sulphate</text><text x="41.6" y="463.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="118.8" y="497.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.55 118.8 497.6)">is formed (double displacement).</text><text x="112.2" y="531.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 112.2 531.7)">Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl</text><text x="113.4" y="599.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 113.4 599.6)">Bacteria in the mouth break down sugar and</text><text x="41.6" y="599.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="118.9" y="633.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 118.9 633.8)">food particles to produce acids.</text><text x="113.6" y="666.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.02 113.6 666.0)">Below pH 5.5 the enamel (calcium</text><text x="114.5" y="700.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 114.5 700.5)">hydroxyapatite) gets corroded.</text><text x="112.6" y="735.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 112.6 735.7)">Toothpaste is basic — it neutralises the</text><text x="114.2" y="769.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 114.2 769.7)">excess acid and prevents decay.</text><text x="114.7" y="838.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 114.7 838.3)">Step 1 – Calcination (heat in limited air):</text><text x="40.7" y="838.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="113.1" y="872.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 113.1 872.2)">ZnCO₃ → ZnO + CO₂</text><text x="118.7" y="905.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 118.7 905.1)">Step 2 – Reduction with carbon:</text><text x="118.9" y="939.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 118.9 939.2)">ZnO + C → Zn + CO</text><text x="115.7" y="973.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 115.7 973.5)">Zn is in the middle of the reactivity series,</text><text x="112.9" y="1007.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 112.9 1007.1)">so its oxide is reduced by carbon.</text><text x="115.2" y="1041.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 115.2 1041.1)">Step 3 – Electrolytic refining.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
