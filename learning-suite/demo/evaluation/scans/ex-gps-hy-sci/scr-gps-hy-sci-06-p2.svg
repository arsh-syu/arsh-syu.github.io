ursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 117.8 269.3)">Aerobic in cytoplasm, anaerobic in mitochondria</text><text x="112.3" y="337.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 112.3 337.4)">(a) R = 10 Ω</text><text x="43.9" y="337.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="118.6" y="369.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 118.6 369.9)">I = V/R = 1.2 A</text><text x="114.2" y="405.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 114.2 405.5)">(b) R = 4 × 6 = 24 Ω</text><text x="113.9" y="437.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 113.9 437.5)">I = 12/24 = 0.5 A</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
