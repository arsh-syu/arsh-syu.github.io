if" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="2" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="581.0" y="116" width="3" height="54" fill="#111"/><rect x="590.0" y="116" width="3" height="54" fill="#111"/><rect x="599.0" y="116" width="2" height="54" fill="#111"/><rect x="602.0" y="116" width="3" height="54" fill="#111"/><rect x="616.0" y="116" width="3" height="54" fill="#111"/><rect x="620.0" y="116" width="1" height="54" fill="#111"/><rect x="627.0" y="116" width="2" height="54" fill="#111"/><rect x="631.0" y="116" width="2" height="54" fill="#111"/><rect x="635.0" y="116" width="3" height="54" fill="#111"/><rect x="640.0" y="116" width="2" height="54" fill="#111"/><rect x="652.0" y="116" width="2" height="54" fill="#111"/><rect x="663.0" y="116" width="2" height="54" fill="#111"/><rect x="667.0" y="116" width="2" height="54" fill="#111"/><rect x="670.0" y="116" width="3" height="54" fill="#111"/><rect x="674.0" y="116" width="1" height="54" fill="#111"/><rect x="679.0" y="116" width="1" height="54" fill="#111"/><rect x="686.0" y="116" width="2" height="54" fill="#111"/><rect x="695.0" y="116" width="2" height="54" fill="#111"/><rect x="703.0" y="116" width="3" height="54" fill="#111"/><rect x="708.0" y="116" width="2" height="54" fill="#111"/><rect x="717.0" y="116" width="1" height="54" fill="#111"/><rect x="720.0" y="116" width="2" height="54" fill="#111"/><rect x="724.0" y="116" width="2" height="54" fill="#111"/><rect x="727.0" y="116" width="3" height="54" fill="#111"/><rect x="733.0" y="116" width="2" height="54" fill="#111"/><rect x="737.0" y="116" width="1" height="54" fill="#111"/><rect x="744.0" y="116" width="2" height="54" fill="#111"/><rect x="756.0" y="116" width="3" height="54" fill="#111"/><rect x="760.0" y="116" width="3" height="54" fill="#111"/><rect x="765.0" y="116" width="2" height="54" fill="#111"/><rect x="769.0" y="116" width="3" height="54" fill="#111"/><rect x="773.0" y="116" width="1" height="54" fill="#111"/><rect x="783.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-S-0605</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="112.6" y="294.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 112.6 294.2)">3Fe + 4H₂O → Fe₃O₄ + 4H₂</text><text x="39.5" y="294.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q1.</text><text x="117.6" y="327.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 117.6 327.1)">Fe: 3 = 3,  H: 8 = 8,  O: 4 = 4</text><text x="116.9" y="362.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 116.9 362.1)">Iron is oxidised, hydrogen is reduced —</text><text x="112.1" y="394.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.55 112.1 394.4)">it is a redox reaction.</text><text x="112.0" y="462.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 112.0 462.7)">White ppt. of BaSO₄ is formed.</text><text x="39.1" y="462.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q2.</text><text x="115.8" y="496.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.54 115.8 496.0)">Na₂SO₄ + BaCl₂ → BaSO₄ + NaCl</text><text x="115.1" y="564.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 115.1 564.0)">Bacteria in the mouth break down sugar and</text><text x="38.9" y="564.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q3.</text><text x="117.5" y="599.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 117.5 599.1)">food particles to produce acids.</text><text x="113.3" y="633.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 113.3 633.3)">Below pH 5.5 the enamel (calcium</text><text x="112.6" y="668.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 112.6 668.2)">hydroxyapatite) gets corroded.</text><text x="118.3" y="701.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 118.3 701.1)">Toothpaste is basic — it neutralises the</text><text x="115.2" y="735.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 115.2 735.7)">excess acid and prevents decay.</text><text x="114.3" y="803.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 114.3 803.4)">Step 1 – Calcination (heat in limited air):</text><text x="42.6" y="803.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q4.</text><text x="112.8" y="837.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 112.8 837.7)">ZnCO₃ → ZnO + CO₂</text><text x="112.3" y="869.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 112.3 869.6)">Step 2 – Reduction with carbon:</text><text x="116.4" y="903.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 116.4 903.7)">ZnO + C → Zn + CO</text><text x="116.1" y="938.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 116.1 938.6)">Zn is in the middle of the reactivity series,</text><text x="115.6" y="972.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 115.6 972.2)">so its oxide is reduced by carbon.</text><text x="116.4" y="1006.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 116.4 1006.1)">Step 3 – Electrolytic refining.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
