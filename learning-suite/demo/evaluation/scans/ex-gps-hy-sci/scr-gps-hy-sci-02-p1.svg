2" height="54" fill="#111"/><rect x="727.0" y="116" width="3" height="54" fill="#111"/><rect x="731.0" y="116" width="3" height="54" fill="#111"/><rect x="736.0" y="116" width="3" height="54" fill="#111"/><rect x="742.0" y="116" width="2" height="54" fill="#111"/><rect x="746.0" y="116" width="1" height="54" fill="#111"/><rect x="753.0" y="116" width="2" height="54" fill="#111"/><rect x="765.0" y="116" width="3" height="54" fill="#111"/><rect x="769.0" y="116" width="3" height="54" fill="#111"/><rect x="774.0" y="116" width="2" height="54" fill="#111"/><rect x="778.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-S-0740</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="117.1" y="294.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 117.1 294.2)">3Fe + 4H₂O → Fe₃O₄ + 4H₂</text><text x="39.2" y="294.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q1.</text><text x="119.1" y="326.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 119.1 326.6)">It is a combination reaction.</text><text x="112.0" y="396.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 112.0 396.3)">Bubbles of gas are formed.</text><text x="42.5" y="396.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q2.</text><text x="118.5" y="430.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 118.5 430.1)">Na₂SO₄ + BaCl₂ → BaS + NaCl</text><text x="117.3" y="498.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 117.3 498.4)">Bacteria produce acids from sugar.</text><text x="40.5" y="498.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q3.</text><text x="118.9" y="531.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 118.9 531.5)">Below pH 5.5 the teeth become weak.</text><text x="114.6" y="565.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 114.6 565.5)">Use toothpaste (basic) to neutralise acid.</text><text x="113.2" y="631.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 113.2 631.6)">Electrolysis of ZnCO₃ gives zinc.</text><text x="38.8" y="631.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q4.</text><text x="115.7" y="667.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 115.7 667.1)">Carbon is a reducing agent.</text><text x="118.6" y="735.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 118.6 735.7)">Aerobic uses O₂, anaerobic does not.</text><text x="39.7" y="735.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q5.</text><text x="119.9" y="769.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 119.9 769.9)">Aerobic gives CO₂ + H₂O; anaerobic gives</text><text x="116.5" y="802.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 116.5 802.5)">alcohol + CO₂.</text><text x="118.3" y="836.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.32 118.3 836.0)">Aerobic gives more energy.</text><text x="114.3" y="870.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.46 114.3 870.2)">Aerobic in cytoplasm, anaerobic in mitochondria</text><text x="118.6" y="937.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 118.6 937.6)">(a) R = 10 Ω</text><text x="39.7" y="937.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q6.</text><text x="113.3" y="973.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 113.3 973.3)">I = V/R = 1.2 A</text><text x="112.7" y="1006.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 112.7 1006.6)">(b) R = 4 × 6 = 24 Ω</text><text x="114.8" y="1042.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.10 114.8 1042.3)">I = 12/24 = 0.5 A</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
