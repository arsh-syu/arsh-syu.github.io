t is a combination reaction.</text><text x="117.6" y="394.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 117.6 394.0)">A white precipitate of barium sulphate</text><text x="43.3" y="394.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q2.</text><text x="113.9" y="430.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 113.9 430.0)">is formed (double displacement).</text><text x="116.5" y="464.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.55 116.5 464.3)">Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl</text><text x="114.4" y="529.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 114.4 529.7)">Bacteria in the mouth break down sugar and</text><text x="41.4" y="529.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q3.</text><text x="114.4" y="563.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.54 114.4 563.9)">food particles to produce acids.</text><text x="112.2" y="600.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 112.2 600.5)">Below pH 5.5 the enamel (calcium</text><text x="117.4" y="633.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.43 117.4 633.7)">hydroxyapatite) gets corroded.</text><text x="116.4" y="666.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 116.4 666.6)">Toothpaste is basic — it neutralises the</text><text x="114.6" y="701.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 114.6 701.1)">excess acid and prevents decay.</text><text x="112.1" y="768.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 112.1 768.4)">Step 1 – Calcination (heat in limited air):</text><text x="38.9" y="768.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q4.</text><text x="115.1" y="803.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.47 115.1 803.0)">ZnCO₃ → ZnO + CO₂</text><text x="119.7" y="835.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 119.7 835.8)">Step 2 – Reduction with carbon:</text><text x="112.1" y="870.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 112.1 870.8)">ZnO + C → Zn + CO</text><text x="115.9" y="905.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.38 115.9 905.0)">Zn is in the middle of the reactivity series,</text><text x="112.4" y="940.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 112.4 940.5)">so its oxide is reduced by carbon.</text><text x="118.1" y="974.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.29 118.1 974.3)">Step 3 – Electrolytic refining.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
