 x="744.0" y="40" width="3" height="26" fill="#111"/><rect x="752.0" y="40" width="2" height="26" fill="#111"/><rect x="755.0" y="40" width="3" height="26" fill="#111"/><rect x="759.0" y="40" width="1" height="26" fill="#111"/><rect x="764.0" y="40" width="1" height="26" fill="#111"/><rect x="771.0" y="40" width="2" height="26" fill="#111"/><rect x="780.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-S-0825</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="118.6" y="133.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 118.6 133.4)">Aerobic uses O₂, anaerobic does not.</text><text x="39.5" y="133.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q5.</text><text x="117.5" y="168.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 117.5 168.2)">Aerobic gives CO₂ + H₂O; anaerobic gives</text><text x="117.8" y="201.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 117.8 201.7)">alcohol + CO₂.</text><text x="118.5" y="235.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 118.5 235.4)">Aerobic gives more energy.</text><text x="118.2" y="269.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 118.2 269.7)">Aerobic in cytoplasm, anaerobic in mitochondria</text><text x="115.3" y="336.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.21 115.3 336.1)">(a) Series: R = R₁ + R₂ = 4 + 6 = 10 Ω</text><text x="40.5" y="336.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q6.</text><text x="119.8" y="369.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 119.8 369.8)">I = V/R = 12/10 = 1.2 A</text><text x="115.6" y="403.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 115.6 403.6)">(b) Parallel: 1/R = 1/4 + 1/6 = 5/12</text><text x="119.8" y="437.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 119.8 437.6)">R = 12/5 = 2.4 Ω</text><text x="117.8" y="472.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 117.8 472.7)">I = V/R = 12/2.4 = 5 A</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
