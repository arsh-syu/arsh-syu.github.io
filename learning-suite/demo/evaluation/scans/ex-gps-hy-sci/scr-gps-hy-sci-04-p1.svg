3" height="54" fill="#111"/><rect x="710.0" y="116" width="2" height="54" fill="#111"/><rect x="724.0" y="116" width="1" height="54" fill="#111"/><rect x="727.0" y="116" width="1" height="54" fill="#111"/><rect x="730.0" y="116" width="3" height="54" fill="#111"/><rect x="736.0" y="116" width="2" height="54" fill="#111"/><rect x="740.0" y="116" width="1" height="54" fill="#111"/><rect x="747.0" y="116" width="2" height="54" fill="#111"/><rect x="759.0" y="116" width="3" height="54" fill="#111"/><rect x="763.0" y="116" width="3" height="54" fill="#111"/><rect x="768.0" y="116" width="2" height="54" fill="#111"/><rect x="772.0" y="116" width="3" height="54" fill="#111"/><rect x="787.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-S-0881</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="113.1" y="294.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 113.1 294.4)">3Fe + 4H₂O → Fe₃O₄ + 4H₂</text><text x="42.6" y="294.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q1.</text><text x="115.6" y="326.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 115.6 326.3)">Fe: 3 = 3,  H: 8 = 8,  O: 4 = 4</text><text x="118.9" y="360.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 118.9 360.7)">Iron is oxidised, hydrogen is reduced —</text><text x="117.5" y="395.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 117.5 395.7)">it is a redox reaction.</text><text x="115.8" y="462.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.48 115.8 462.5)">A white precipitate of barium sulphate</text><text x="40.4" y="462.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q2.</text><text x="113.8" y="495.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 113.8 495.7)">is formed (double displacement).</text><text x="116.6" y="530.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 116.6 530.6)">Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl</text><text x="112.5" y="600.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 112.5 600.1)">Bacteria in the mouth break down sugar and</text><text x="41.3" y="600.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q3.</text><text x="117.7" y="634.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 117.7 634.0)">food particles to produce acids.</text><text x="114.3" y="668.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 114.3 668.3)">Below pH 5.5 the enamel (calcium</text><text x="115.1" y="699.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 115.1 699.8)">hydroxyapatite) gets corroded.</text><text x="119.4" y="736.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 119.4 736.3)">Toothpaste is basic — it neutralises the</text><text x="112.1" y="769.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 112.1 769.8)">excess acid and prevents decay.</text><text x="120.0" y="835.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 120.0 835.8)">Step 1 – Calcination (heat in limited air):</text><text x="42.1" y="835.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1a2b6b">Q4.</text><text x="117.4" y="870.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 117.4 870.1)">ZnCO₃ → ZnO + CO₂</text><text x="115.7" y="903.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 115.7 903.6)">Step 2 – Reduction with carbon:</text><text x="113.7" y="938.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 113.7 938.0)">ZnO + C → Zn + CO</text><text x="116.1" y="972.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 116.1 972.8)">Zn is in the middle of the reactivity series,</text><text x="119.6" y="1006.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 119.6 1006.2)">so its oxide is reduced by carbon.</text><text x="115.9" y="1040.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1a2b6b" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 115.9 1040.1)">Step 3 – Electrolytic refining.</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
