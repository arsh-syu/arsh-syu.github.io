<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">GPS</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">EST. 1998</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">GREENFIELD PUBLIC SCHOOL, PUNE</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Affiliated to CBSE, New Delhi · Affiliation No. 1130457</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">Half-Yearly Examination 2026-27</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">Class X · Science · Subject Code 086</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 1½ hours</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 20</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  This question paper has 6 questions. All questions are compulsory.</text><text x="52" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Write balanced chemical equations and show all working in numericals.</text><text x="52" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">3.  Answers must be precise; marks are awarded step-wise as per the marking scheme.</text><rect x="40" y="303" width="770" height="28" fill="#f3f4f6"/><text x="425" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · 2 MARKS EACH</text><text x="44" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="357" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Balance the following chemical equation and identify the type of reaction: Fe + H₂O</text><text x="76" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">→ Fe₃O₄ + H₂</text><text x="806" y="378" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[2]</text><text x="44" y="417" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="417" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">What happens when an aqueous solution of sodium sulphate reacts with an aqueous</text><text x="76" y="438" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">solution of barium chloride? Write the balanced chemical equation.</text><text x="806" y="438" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[2]</text><rect x="40" y="467" width="770" height="28" fill="#f3f4f6"/><text x="425" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · 3 MARKS</text><text x="44" y="521" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="521" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Tooth decay starts when the pH of the mouth is lower than 5.5. Explain why, and</text><text x="76" y="542" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">state how it can be prevented.</text><text x="806" y="542" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><rect x="40" y="571" width="770" height="28" fill="#f3f4f6"/><text x="425" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION C · 4 MARKS EACH</text><text x="44" y="625" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="625" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Zinc is found in nature as zinc carbonate (calamine). Outline the steps to obtain</text><text x="76" y="646" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">pure zinc metal from this ore. Why can carbon be used for the reduction?</text><text x="806" y="646" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="685" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="685" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Differentiate between aerobic and anaerobic respiration (any four points).</text><text x="806" y="685" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><rect x="40" y="714" width="770" height="28" fill="#f3f4f6"/><text x="425" y="733" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION D · 5 MARKS</text><text x="44" y="768" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">6.</text><text x="76" y="768" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Two resistors of 4 Ω and 6 Ω are connected to a 12 V battery (a) in series and (b)</text><text x="76" y="789" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">in parallel. Find the current drawn from the battery in each case.</text><text x="806" y="789" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="425" y="838" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>