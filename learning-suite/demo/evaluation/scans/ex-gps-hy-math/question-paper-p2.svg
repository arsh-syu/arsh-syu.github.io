<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><text x="44" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Half-Yearly Examination 2026-27 · Class X · Mathematics (Standard) · Subject Code 041</text><rect x="40" y="60" width="770" height="28" fill="#f3f4f6"/><text x="425" y="79" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION D · CASE-BASED · 5 MARKS</text><text x="44" y="114" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">9.</text><text x="76" y="114" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Case study: A train travels 360 km at a uniform speed. If the speed had been 5 km/h</text><text x="76" y="135" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">more, it would have taken 1 hour less for the same journey. Form a quadratic</text><text x="76" y="156" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">equation and find the speed of the train.</text><text x="806" y="156" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="425" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2</text></svg>