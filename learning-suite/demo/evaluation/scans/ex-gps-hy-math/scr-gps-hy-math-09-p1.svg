-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="2" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="581.0" y="116" width="3" height="54" fill="#111"/><rect x="590.0" y="116" width="3" height="54" fill="#111"/><rect x="595.0" y="116" width="3" height="54" fill="#111"/><rect x="600.0" y="116" width="2" height="54" fill="#111"/><rect x="603.0" y="116" width="3" height="54" fill="#111"/><rect x="608.0" y="116" width="2" height="54" fill="#111"/><rect x="611.0" y="116" width="1" height="54" fill="#111"/><rect x="616.0" y="116" width="3" height="54" fill="#111"/><rect x="620.0" y="116" width="1" height="54" fill="#111"/><rect x="627.0" y="116" width="2" height="54" fill="#111"/><rect x="631.0" y="116" width="2" height="54" fill="#111"/><rect x="635.0" y="116" width="3" height="54" fill="#111"/><rect x="640.0" y="116" width="2" height="54" fill="#111"/><rect x="648.0" y="116" width="3" height="54" fill="#111"/><rect x="653.0" y="116" width="2" height="54" fill="#111"/><rect x="662.0" y="116" width="2" height="54" fill="#111"/><rect x="665.0" y="116" width="1" height="54" fill="#111"/><rect x="670.0" y="116" width="3" height="54" fill="#111"/><rect x="674.0" y="116" width="1" height="54" fill="#111"/><rect x="679.0" y="116" width="1" height="54" fill="#111"/><rect x="686.0" y="116" width="2" height="54" fill="#111"/><rect x="695.0" y="116" width="2" height="54" fill="#111"/><rect x="708.0" y="116" width="2" height="54" fill="#111"/><rect x="722.0" y="116" width="2" height="54" fill="#111"/><rect x="726.0" y="116" width="3" height="54" fill="#111"/><rect x="732.0" y="116" width="2" height="54" fill="#111"/><rect x="736.0" y="116" width="1" height="54" fill="#111"/><rect x="743.0" y="116" width="2" height="54" fill="#111"/><rect x="755.0" y="116" width="3" height="54" fill="#111"/><rect x="764.0" y="116" width="2" height="54" fill="#111"/><rect x="768.0" y="116" width="3" height="54" fill="#111"/><rect x="777.0" y="116" width="2" height="54" fill="#111"/><rect x="781.0" y="116" width="3" height="54" fill="#111"/><rect x="787.0" y="116" width="2" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0458</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 2</text><text x="112.0" y="293.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 112.0 293.2)">96 = 2⁴ × 6</text><text x="41.1" y="293.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q1.</text><text x="113.8" y="326.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.00 113.8 326.2)">404 = 4 × 101</text><text x="115.7" y="362.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 115.7 362.0)">HCF = 4</text><text x="112.8" y="394.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.15 112.8 394.5)">LCM = 96 × 101 = 9696</text><text x="112.4" y="462.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 112.4 462.7)">x² − 2x − 8 = x² + 4x − 2x − 8</text><text x="38.9" y="462.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="113.4" y="496.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 113.4 496.6)">= (x + 4)(x − 2) ⇒ zeroes −4, 2</text><text x="118.3" y="530.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 118.3 530.7)">Sum = −2, Product = −8</text><text x="116.7" y="599.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.32 116.7 599.6)">(1) − (2): 7y = 35</text><text x="39.6" y="599.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="113.4" y="634.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 113.4 634.2)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="118.4" y="666.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 118.4 666.4)">∴ x = −2, y = 5</text><text x="114.3" y="735.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 114.3 735.9)">a = 3, d = 15 − 3 = 12</text><text x="41.6" y="735.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="116.6" y="770.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 116.6 770.3)">a₅₄ = a + 53d = 3 + 53 × 12 = 639</text><text x="118.3" y="804.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 118.3 804.0)">Required term = 639 + 132 = 771</text><text x="118.0" y="838.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 118.0 838.3)">3 + (n − 1)12 = 771 ⇒ n − 1 = 64</text><text x="118.2" y="870.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 118.2 870.2)">n = 65  ∴ 65th term</text><text x="119.4" y="939.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 119.4 939.9)">x = (−3k + 6)/(k + 1) = −1</text><text x="43.0" y="939.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q5.</text><text x="118.5" y="974.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 118.5 974.0)">−3k + 6 = −k − 1 ⇒ k = 7/2</text><text x="117.4" y="1007.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 117.4 1007.2)">∴ Ratio = 7 : 2</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
