× 101</text><text x="112.7" y="360.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 112.7 360.4)">HCF = 2² = 4</text><text x="112.3" y="394.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 112.3 394.1)">LCM = 2⁵ × 3 × 101 = 9690</text><text x="116.2" y="463.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 116.2 463.5)">x² − 4x + 2x − 8 = (x − 4)(x + 2)</text><text x="39.1" y="463.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q2.</text><text x="116.5" y="497.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 116.5 497.0)">zeroes: 4, −2</text><text x="117.8" y="530.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 117.8 530.7)">Sum = 2 = b/a</text><text x="116.7" y="565.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 116.7 565.2)">Product = −8 = c/a ✓</text><text x="112.0" y="632.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 112.0 632.0)">(1) − (2): 7y = 35</text><text x="40.4" y="632.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q3.</text><text x="117.9" y="666.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 117.9 666.6)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="112.7" y="700.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 112.7 700.8)">∴ x = −2, y = 5</text><text x="117.6" y="769.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 117.6 769.8)">a = 3, d = 12</text><text x="39.0" y="769.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q4.</text><text x="116.8" y="804.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 116.8 804.2)">a₅₄ = 3 + 54 × 12 = 651</text><text x="112.0" y="837.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 112.0 837.1)">651 + 132 = 783</text><text x="113.6" y="871.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 113.6 871.7)">3 + (n − 1)12 = 783 ⇒ n = 66</text><text x="117.6" y="938.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 117.6 938.9)">Let ratio = k : 1</text><text x="41.9" y="938.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q5.</text><text x="112.1" y="971.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 112.1 971.9)">(6k − 3)/(k + 1) = −1</text><text x="113.1" y="1007.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 113.1 1007.9)">7k = 2 ⇒ k = 2/7</text><text x="118.0" y="1041.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 118.0 1041.9)">Ratio 2 : 7</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
