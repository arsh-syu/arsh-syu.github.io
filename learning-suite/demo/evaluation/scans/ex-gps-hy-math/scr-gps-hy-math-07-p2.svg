space="preserve" style="white-space:pre" transform="rotate(-0.41 118.7 301.6)">Since DE ∥ BC, by BPT: AD/DB = AE/EC</text><text x="38.1" y="301.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q8.</text><text x="117.9" y="337.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 117.9 337.7)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="117.4" y="406.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 117.4 406.4)">Let the speed of the train be x km/h</text><text x="39.4" y="406.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q9.</text><text x="114.3" y="437.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 114.3 437.8)">360/x − 360/(x + 5) = 1</text><text x="119.7" y="471.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 119.7 471.9)">360(x + 5) − 360x = x(x + 5)</text><text x="115.3" y="506.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 115.3 506.6)">x² + 5x − 1800 = 0</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
