e" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 113.1 269.1)">x² + 45x − 40x − 1800 = 0</text><text x="114.9" y="302.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 114.9 302.5)">(x + 45)(x − 40) = 0 ⇒ x = 40 or −45</text><text x="112.4" y="336.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.21 112.4 336.0)">Speed cannot be negative ∴ 40 km/h</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
