rect x="729.0" y="40" width="3" height="26" fill="#111"/><rect x="734.0" y="40" width="2" height="26" fill="#111"/><rect x="743.0" y="40" width="2" height="26" fill="#111"/><rect x="747.0" y="40" width="2" height="26" fill="#111"/><rect x="753.0" y="40" width="3" height="26" fill="#111"/><rect x="757.0" y="40" width="1" height="26" fill="#111"/><rect x="762.0" y="40" width="1" height="26" fill="#111"/><rect x="769.0" y="40" width="2" height="26" fill="#111"/><rect x="778.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0797</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="116.5" y="134.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 116.5 134.1)">6x² − x − 2 = 0</text><text x="41.4" y="134.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q6.</text><text x="112.4" y="167.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 112.4 167.1)">6x² − 3x + 2x − 2 = 0</text><path d="M108.4206926357001 161.12705031433143 q 55.125 -1.0847791507840157 110.25 1 t 110.25 -2" stroke="#22306e" stroke-width="2" fill="none" opacity="0.9"/><path d="M114.4206926357001 166.12705031433143 L 332.9206926357001 155.12705031433143" stroke="#22306e" stroke-width="1.6" fill="none" opacity="0.8"/><text x="115.3" y="200.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.50 115.3 200.7)">6x² − 4x + 3x − 2 = 0</text><text x="114.6" y="236.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 114.6 236.5)">2x(3x − 2) − 1(3x − 2) = 0</text><text x="115.9" y="268.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 115.9 268.8)">(3x − 2)(2x − 1) = 0</text><text x="118.6" y="303.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 118.6 303.1)">x = 2/3, x = 1/2</text><text x="117.8" y="370.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.48 117.8 370.5)">For equal roots D &gt; 0</text><text x="40.5" y="370.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q7.</text><text x="112.4" y="406.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 112.4 406.5)">k² − 4 × 2 × 3 &gt; 0</text><text x="117.8" y="439.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 117.8 439.0)">k² &gt; 24</text><text x="117.7" y="474.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 117.7 474.4)">k &gt; 2√6</text><text x="113.7" y="541.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 113.7 541.2)">By BPT, AD/DB = AE/EC</text><text x="42.6" y="541.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q8.</text><text x="118.9" y="575.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 118.9 575.8)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="117.1" y="609.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 117.1 609.7)">x² − x = x² + 4</text><text x="112.6" y="641.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.10 112.6 641.6)">x = −4</text><text x="112.8" y="710.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 112.8 710.9)">Let speed = x</text><text x="42.8" y="710.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q9.</text><text x="115.2" y="744.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.44 115.2 744.2)">360/x − 360/(x + 5) = 1</text><text x="114.5" y="779.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.42 114.5 779.2)">360x + 1800 − 360x = x² + 5x</text><text x="116.9" y="812.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 116.9 812.2)">x² + 5x + 1800 = 0</text><text x="116.1" y="846.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 116.1 846.3)">x = (−5 ± √(25 + 7200))/2</text><path d="M112.096167139709 840.3005907291081 q 65.625 -3.8343336675316095 131.25 1 t 131.25 -2" stroke="#22306e" stroke-width="2" fill="none" opacity="0.9"/><path d="M118.096167139709 845.3005907291081 L 378.596167139709 834.3005907291081" stroke="#22306e" stroke-width="1.6" fill="none" opacity="0.8"/><text x="119.8" y="879.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.51 119.8 879.5)">x = (−5 ± √(25 − 7200))/2 — no real root</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
