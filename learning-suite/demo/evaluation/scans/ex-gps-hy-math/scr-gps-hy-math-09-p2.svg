rect x="728.0" y="40" width="3" height="26" fill="#111"/><rect x="733.0" y="40" width="2" height="26" fill="#111"/><rect x="742.0" y="40" width="2" height="26" fill="#111"/><rect x="745.0" y="40" width="1" height="26" fill="#111"/><rect x="750.0" y="40" width="3" height="26" fill="#111"/><rect x="754.0" y="40" width="1" height="26" fill="#111"/><rect x="759.0" y="40" width="1" height="26" fill="#111"/><rect x="766.0" y="40" width="2" height="26" fill="#111"/><rect x="775.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0458</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="113.4" y="132.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 113.4 132.5)">6x² − 4x + 3x − 2 = 0</text><text x="38.9" y="132.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q6.</text><text x="115.1" y="165.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 115.1 165.6)">2x(3x − 2) + 1(3x − 2) = 0</text><text x="118.9" y="201.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 118.9 201.5)">(3x − 2)(2x + 1) = 0</text><text x="117.0" y="235.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 117.0 235.0)">x = 2/3, x = 1/2</text><text x="115.6" y="303.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 115.6 303.7)">For equal roots D &gt; 0</text><text x="41.8" y="303.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q7.</text><text x="115.3" y="336.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 115.3 336.9)">k² − 4 × 2 × 3 &gt; 0</text><text x="114.6" y="370.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 114.6 370.2)">k² &gt; 24</text><text x="113.9" y="405.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 113.9 405.5)">k &gt; 2√6</text><text x="118.6" y="473.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 118.6 473.5)">AD/AB = AE/EC</text><text x="40.4" y="473.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q8.</text><text x="116.6" y="506.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 116.6 506.9)">x/(2x − 2) = (x + 2)/(x − 1)</text><text x="112.1" y="539.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 112.1 539.9)">x² − x = 2x² + 2x − 4 …</text><text x="118.0" y="608.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.02 118.0 608.3)">Let speed = x km/h</text><text x="41.0" y="608.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q9.</text><text x="119.8" y="642.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 119.8 642.7)">360/x − 360/(x + 5) = 1</text><text x="118.2" y="678.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.27 118.2 678.4)">x² + 5x − 1800 = 0</text><text x="118.2" y="712.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 118.2 712.4)">(x + 45)(x − 40) = 0</text><text x="119.8" y="744.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 119.8 744.4)">x = 40, −45  ∴ speed = 40</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
