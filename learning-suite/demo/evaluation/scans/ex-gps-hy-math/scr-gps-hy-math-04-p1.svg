.9" opacity="0.75"/><line x1="30" y1="1014" x2="820" y2="1014" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="30" y1="1048" x2="820" y2="1048" stroke="#9fb6d6" stroke-width="0.9" opacity="0.75"/><line x1="96" y1="260" x2="96" y2="1070" stroke="#e08a8a" stroke-width="1.3" opacity="0.85"/><line x1="100" y1="260" x2="100" y2="1070" stroke="#e08a8a" stroke-width="0.7" opacity="0.6"/><text x="425" y="58" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="bold" fill="#1f2937" letter-spacing="1">GREENFIELD PUBLIC SCHOOL, PUNE</text><text x="425" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Half-Yearly Examination 2026-27 · ANSWER BOOKLET</text><line x1="40" y1="96" x2="810" y2="96" stroke="#374151" stroke-width="1.2"/><text x="44" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Subject:</text><line x1="104.4" y1="135" x2="374" y2="135" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="112" y="129" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">Mathematics (041)</text><text x="44" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Date of exam:</text><line x1="138.39999999999998" y1="171" x2="374" y2="171" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="140" y="165" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">09/10/2026</text><text x="44" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">No. of pages used:</text><line x1="172.39999999999998" y1="207" x2="374" y2="207" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><text x="190" y="201" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="19" fill="#1e3a8a">3</text><text x="44" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="2" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="581.0" y="116" width="3" height="54" fill="#111"/><rect x="590.0" y="116" width="3" height="54" fill="#111"/><rect x="595.0" y="116" width="3" height="54" fill="#111"/><rect x="600.0" y="116" width="2" height="54" fill="#111"/><rect x="603.0" y="116" width="3" height="54" fill="#111"/><rect x="611.0" y="116" width="1" height="54" fill="#111"/><rect x="613.0" y="116" width="2" height="54" fill="#111"/><rect x="617.0" y="116" width="3" height="54" fill="#111"/><rect x="621.0" y="116" width="1" height="54" fill="#111"/><rect x="628.0" y="116" width="2" height="54" fill="#111"/><rect x="632.0" y="116" width="2" height="54" fill="#111"/><rect x="636.0" y="116" width="3" height="54" fill="#111"/><rect x="641.0" y="116" width="2" height="54" fill="#111"/><rect x="649.0" y="116" width="3" height="54" fill="#111"/><rect x="654.0" y="116" width="2" height="54" fill="#111"/><rect x="663.0" y="116" width="2" height="54" fill="#111"/><rect x="667.0" y="116" width="1" height="54" fill="#111"/><rect x="669.0" y="116" width="2" height="54" fill="#111"/><rect x="673.0" y="116" width="3" height="54" fill="#111"/><rect x="677.0" y="116" width="1" height="54" fill="#111"/><rect x="682.0" y="116" width="1" height="54" fill="#111"/><rect x="689.0" y="116" width="2" height="54" fill="#111"/><rect x="698.0" y="116" width="2" height="54" fill="#111"/><rect x="711.0" y="116" width="2" height="54" fill="#111"/><rect x="720.0" y="116" width="2" height="54" fill="#111"/><rect x="730.0" y="116" width="3" height="54" fill="#111"/><rect x="736.0" y="116" width="2" height="54" fill="#111"/><rect x="740.0" y="116" width="1" height="54" fill="#111"/><rect x="747.0" y="116" width="2" height="54" fill="#111"/><rect x="759.0" y="116" width="3" height="54" fill="#111"/><rect x="768.0" y="116" width="2" height="54" fill="#111"/><rect x="772.0" y="116" width="3" height="54" fill="#111"/><rect x="786.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0752</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 3</text><text x="117.0" y="293.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 117.0 293.2)">96 = 2 × 2 × 2 × 2 × 2 × 3 = 2⁵ × 3</text><text x="43.6" y="293.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q1.</text><text x="119.6" y="325.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 119.6 325.7)">404 = 2 × 2 × 101 = 2² × 101</text><text x="118.6" y="362.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 118.6 362.3)">HCF = 2² = 4</text><text x="116.9" y="394.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.24 116.9 394.7)">LCM = 2⁵ × 3 × 101 = 9696</text><text x="119.5" y="462.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 119.5 462.2)">x² − 2x − 8 = x² − 4x + 2x − 8</text><text x="40.9" y="462.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="114.4" y="497.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 114.4 497.3)">= (x − 4)(x + 2) ⇒ zeroes are 4, −2</text><text x="116.7" y="530.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 116.7 530.6)">Sum = 4 + (−2) = 2 = −(−2)/1 = −b/a ✓</text><text x="112.9" y="565.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.48 112.9 565.7)">Product = 4 × (−2) = −8 = c/a ✓</text><text x="113.7" y="631.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 113.7 631.7)">2x + 3y = 11 …(1),  2x − 4y = −24 …(2)</text><text x="40.5" y="631.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="117.5" y="667.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 117.5 667.1)">(1) − (2): 7y = 35</text><text x="119.7" y="701.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 119.7 701.9)">y = 5;  2x + 15 = 11 ⇒ x = −2</text><text x="114.4" y="735.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 114.4 735.7)">Check: 2(−2) − 4(5) = −24 ✓</text><text x="114.0" y="768.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 114.0 768.4)">∴ x = −2, y = 5</text><text x="117.1" y="836.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 117.1 836.2)">a = 3, d = 15 − 3 = 12</text><text x="41.9" y="836.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="117.9" y="870.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 117.9 870.1)">a₅₄ = a + 53d = 3 + 53 × 12 = 639</text><text x="116.2" y="903.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 116.2 903.9)">Required term = 639 + 132 = 771</text><text x="118.1" y="938.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 118.1 938.9)">3 + (n − 1)12 = 771 ⇒ n − 1 = 64</text><text x="116.8" y="974.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.46 116.8 974.0)">n = 65  ∴ 65th term</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
