rect x="737.0" y="40" width="2" height="26" fill="#111"/><rect x="754.0" y="40" width="3" height="26" fill="#111"/><rect x="759.0" y="40" width="3" height="26" fill="#111"/><rect x="763.0" y="40" width="1" height="26" fill="#111"/><rect x="768.0" y="40" width="1" height="26" fill="#111"/><rect x="775.0" y="40" width="2" height="26" fill="#111"/><rect x="784.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0539</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 3</text><text x="114.6" y="132.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 114.6 132.8)">Let the ratio be k : 1</text><text x="40.7" y="132.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q5.</text><text x="119.1" y="168.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 119.1 168.3)">x = (6k − 3)/(k + 1) = −1</text><text x="115.6" y="200.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.50 115.6 200.0)">6k − 3 = −k − 1 ⇒ 7k = 2 ⇒ k = 2/7</text><text x="118.1" y="235.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 118.1 235.1)">Check y: (−8k + 10)/(k + 1) = 6 ✓</text><text x="117.7" y="269.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 117.7 269.6)">∴ Ratio = 2 : 7</text><text x="114.2" y="337.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 114.2 337.6)">6x² − x − 2 = 0</text><text x="42.2" y="337.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="115.8" y="369.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 115.8 369.9)">6x² − 3x + 2x − 2 = 0</text><path d="M111.80422290787101 363.9118526172824 q 55.125 -3.0097946962341666 110.25 1 t 110.25 -2" stroke="#172554" stroke-width="2" fill="none" opacity="0.9"/><path d="M117.80422290787101 368.9118526172824 L 336.304222907871 357.9118526172824" stroke="#172554" stroke-width="1.6" fill="none" opacity="0.8"/><text x="114.8" y="404.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 114.8 404.9)">6x² − 4x + 3x − 2 = 0</text><text x="119.5" y="439.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 119.5 439.6)">2x(3x − 2) − 1(3x − 2) = 0</text><text x="113.2" y="473.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 113.2 473.6)">(3x − 2)(2x − 1) = 0</text><text x="114.9" y="508.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 114.9 508.4)">x = 2/3, x = 1/2</text><text x="114.7" y="574.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 114.7 574.7)">D = b² − 4ac = 0</text><text x="40.2" y="574.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q7.</text><text x="113.9" y="608.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.48 113.9 608.8)">k² − 24 = 0</text><text x="117.7" y="644.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 117.7 644.0)">k² = 24</text><text x="116.7" y="677.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 116.7 677.7)">k = 2√6</text><text x="115.3" y="745.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 115.3 745.1)">Since DE ∥ BC, by BPT: AD/DB = AE/EC</text><text x="40.1" y="745.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q8.</text><text x="115.0" y="780.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.20 115.0 780.0)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="113.9" y="812.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 113.9 812.6)">x(x − 1) = (x + 2)(x − 2)</text><text x="115.6" y="846.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 115.6 846.5)">x² − x = x² − 4</text><text x="118.4" y="881.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.48 118.4 881.7)">−x = −4 ⇒ x = 4</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
