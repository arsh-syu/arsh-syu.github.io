e-space:pre" transform="rotate(0.41 119.4 327.3)">404 = 4 × 101</text><text x="119.0" y="360.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 119.0 360.4)">HCF = 4</text><text x="119.6" y="393.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 119.6 393.7)">LCM = 96 × 101 = 9696</text><text x="115.5" y="461.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 115.5 461.9)">x² − 4x + 2x − 8 = (x − 4)(x + 2)</text><text x="41.2" y="461.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="114.4" y="498.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 114.4 498.3)">zeroes: 4, −2</text><text x="112.9" y="531.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 112.9 531.3)">Sum = 2 = b/a</text><text x="116.4" y="565.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 116.4 565.8)">Product = −8 = c/a ✓</text><text x="117.8" y="633.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 117.8 633.3)">(1) − (2): 7y = 35</text><text x="38.1" y="633.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="119.5" y="665.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 119.5 665.6)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="113.1" y="699.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 113.1 699.6)">∴ x = −2, y = 5</text><text x="114.9" y="769.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 114.9 769.0)">a = 3, d = 12</text><text x="43.4" y="769.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="117.6" y="802.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.05 117.6 802.9)">a₅₄ = 3 + 54 × 12 = 651</text><text x="117.0" y="835.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 117.0 835.9)">651 + 132 = 783</text><text x="116.3" y="871.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 116.3 871.2)">3 + (n − 1)12 = 783 ⇒ n = 66</text><text x="112.7" y="938.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.29 112.7 938.7)">Let ratio = k : 1</text><text x="42.7" y="938.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q5.</text><text x="117.2" y="973.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 117.2 973.4)">(6k − 3)/(k + 1) = −1</text><text x="115.6" y="1005.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 115.6 1005.6)">7k = 2 ⇒ k = 2/7</text><text x="114.4" y="1042.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 114.4 1042.4)">Ratio 2 : 7</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
