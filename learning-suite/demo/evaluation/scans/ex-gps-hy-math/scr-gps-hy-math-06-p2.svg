text><text x="113.4" y="233.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.51 113.4 233.7)">2x(3x − 2) − 1(3x − 2) = 0</text><text x="112.4" y="268.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.50 112.4 268.4)">(3x − 2)(2x − 1) = 0</text><text x="114.2" y="304.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 114.2 304.3)">x = 2/3, x = 1/2</text><text x="119.6" y="370.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 119.6 370.3)">D = b² − 4ac = 0</text><text x="42.6" y="370.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q7.</text><text x="116.6" y="403.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 116.6 403.6)">k² − 24 = 0</text><text x="115.6" y="438.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 115.6 438.9)">k² = 24</text><text x="112.3" y="472.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 112.3 472.1)">k = 2√6</text><text x="118.5" y="540.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 118.5 540.8)">AD/AB = AE/EC</text><text x="39.7" y="540.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q8.</text><text x="112.8" y="574.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.29 112.8 574.3)">x/(2x − 2) = (x + 2)/(x − 1)</text><text x="116.9" y="610.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 116.9 610.5)">x² − x = 2x² + 2x − 4 …</text><text x="112.2" y="676.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 112.2 676.8)">Let speed = x km/h</text><text x="39.2" y="676.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q9.</text><text x="117.0" y="711.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 117.0 711.7)">360/x − 360/(x + 5) = 1</text><text x="119.9" y="744.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 119.9 744.9)">x² + 5x − 1800 = 0</text><text x="112.9" y="779.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 112.9 779.7)">(x + 45)(x − 40) = 0</text><text x="116.5" y="811.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 116.5 811.7)">x = 40, −45  ∴ speed = 40</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
