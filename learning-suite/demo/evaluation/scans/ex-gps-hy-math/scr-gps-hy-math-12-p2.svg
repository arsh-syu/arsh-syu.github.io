rect x="730.0" y="40" width="3" height="26" fill="#111"/><rect x="735.0" y="40" width="2" height="26" fill="#111"/><rect x="747.0" y="40" width="2" height="26" fill="#111"/><rect x="754.0" y="40" width="3" height="26" fill="#111"/><rect x="758.0" y="40" width="1" height="26" fill="#111"/><rect x="763.0" y="40" width="1" height="26" fill="#111"/><rect x="770.0" y="40" width="2" height="26" fill="#111"/><rect x="779.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0994</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 2</text><text x="119.9" y="134.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 119.9 134.0)">6x² − 4x + 3x − 2 = 0</text><text x="38.5" y="134.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="115.9" y="168.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 115.9 168.2)">2x(3x − 2) + 1(3x − 2) = 0</text><text x="113.9" y="201.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 113.9 201.2)">(3x − 2)(2x + 1) = 0</text><text x="119.8" y="234.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 119.8 234.2)">x = 2/3, x = 1/2</text><text x="117.5" y="304.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.42 117.5 304.2)">D = b² − 4ac = 0</text><text x="40.8" y="304.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q7.</text><text x="113.1" y="337.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 113.1 337.9)">k² − 24 = 0</text><text x="118.0" y="370.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 118.0 370.6)">k² = 24</text><text x="116.0" y="405.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.21 116.0 405.3)">k = 2√6</text><text x="113.5" y="474.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 113.5 474.4)">By BPT, AD/DB = AE/EC</text><text x="44.0" y="474.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q8.</text><text x="117.0" y="508.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 117.0 508.0)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="118.9" y="541.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 118.9 541.2)">x² − x = x² + 4</text><text x="117.7" y="575.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 117.7 575.2)">x = −4</text><text x="113.6" y="643.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 113.6 643.3)">Let the speed of the train be x km/h</text><text x="39.1" y="643.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q9.</text><text x="114.6" y="678.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 114.6 678.2)">360/x − 360/(x + 5) = 1</text><text x="113.8" y="709.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 113.8 709.8)">360(x + 5) − 360x = x(x + 5)</text><text x="114.4" y="746.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 114.4 746.3)">x² + 5x − 1800 = 0</text><text x="117.8" y="778.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 117.8 778.3)">x² + 45x − 40x − 1800 = 0</text><text x="117.4" y="813.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 117.4 813.4)">(x + 45)(x − 40) = 0 ⇒ x = 40 or −45</text><text x="116.7" y="848.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.08 116.7 848.1)">Speed cannot be negative ∴ 40 km/h</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
