-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="2" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="581.0" y="116" width="3" height="54" fill="#111"/><rect x="590.0" y="116" width="3" height="54" fill="#111"/><rect x="595.0" y="116" width="3" height="54" fill="#111"/><rect x="600.0" y="116" width="2" height="54" fill="#111"/><rect x="603.0" y="116" width="3" height="54" fill="#111"/><rect x="608.0" y="116" width="3" height="54" fill="#111"/><rect x="620.0" y="116" width="3" height="54" fill="#111"/><rect x="624.0" y="116" width="1" height="54" fill="#111"/><rect x="631.0" y="116" width="2" height="54" fill="#111"/><rect x="635.0" y="116" width="2" height="54" fill="#111"/><rect x="639.0" y="116" width="3" height="54" fill="#111"/><rect x="644.0" y="116" width="2" height="54" fill="#111"/><rect x="652.0" y="116" width="3" height="54" fill="#111"/><rect x="657.0" y="116" width="2" height="54" fill="#111"/><rect x="674.0" y="116" width="3" height="54" fill="#111"/><rect x="679.0" y="116" width="3" height="54" fill="#111"/><rect x="683.0" y="116" width="1" height="54" fill="#111"/><rect x="688.0" y="116" width="1" height="54" fill="#111"/><rect x="695.0" y="116" width="2" height="54" fill="#111"/><rect x="704.0" y="116" width="2" height="54" fill="#111"/><rect x="717.0" y="116" width="2" height="54" fill="#111"/><rect x="730.0" y="116" width="2" height="54" fill="#111"/><rect x="733.0" y="116" width="3" height="54" fill="#111"/><rect x="738.0" y="116" width="3" height="54" fill="#111"/><rect x="744.0" y="116" width="2" height="54" fill="#111"/><rect x="748.0" y="116" width="1" height="54" fill="#111"/><rect x="755.0" y="116" width="2" height="54" fill="#111"/><rect x="767.0" y="116" width="3" height="54" fill="#111"/><rect x="776.0" y="116" width="2" height="54" fill="#111"/><rect x="780.0" y="116" width="3" height="54" fill="#111"/><rect x="784.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0539</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 3</text><text x="114.0" y="294.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.32 114.0 294.3)">96 = 2 × 2 × 2 × 2 × 2 × 3 = 2⁵ × 3</text><text x="38.2" y="294.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q1.</text><text x="113.2" y="326.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.16 113.2 326.0)">404 = 2 × 2 × 101 = 2² × 101</text><text x="118.6" y="362.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 118.6 362.0)">HCF = 2² = 4</text><text x="116.0" y="396.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 116.0 396.1)">LCM = 2⁵ × 3 × 101 = 9696</text><text x="118.4" y="461.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 118.4 461.6)">x² − 2x − 8 = x² − 4x + 2x − 8</text><text x="43.7" y="461.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q2.</text><text x="116.3" y="498.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 116.3 498.2)">= (x − 4)(x + 2) ⇒ zeroes are 4, −2</text><text x="115.2" y="531.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 115.2 531.9)">Sum = 4 + (−2) = 2 = −(−2)/1 = −b/a ✓</text><text x="112.8" y="566.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 112.8 566.2)">Product = 4 × (−2) = −8 = c/a ✓</text><text x="116.6" y="634.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 116.6 634.3)">(1) − (2): 7y = 35</text><text x="41.0" y="634.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q3.</text><text x="112.7" y="668.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 112.7 668.0)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="115.8" y="701.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 115.8 701.3)">∴ x = −2, y = 5</text><text x="118.9" y="769.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 118.9 769.5)">a = 3, d = 15 − 3 = 12</text><text x="43.7" y="769.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q4.</text><text x="112.2" y="802.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 112.2 802.9)">a₅₄ = a + 53d = 3 + 53 × 12 = 639</text><text x="115.4" y="835.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.38 115.4 835.5)">Required term = 639 + 132 = 771</text><text x="115.5" y="869.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.32 115.5 869.5)">3 + (n − 1)12 = 771 ⇒ n − 1 = 64</text><text x="118.5" y="904.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 118.5 904.1)">n = 65  ∴ 65th term</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>