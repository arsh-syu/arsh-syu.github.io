rect x="729.0" y="40" width="3" height="26" fill="#111"/><rect x="734.0" y="40" width="2" height="26" fill="#111"/><rect x="743.0" y="40" width="2" height="26" fill="#111"/><rect x="747.0" y="40" width="1" height="26" fill="#111"/><rect x="749.0" y="40" width="2" height="26" fill="#111"/><rect x="753.0" y="40" width="3" height="26" fill="#111"/><rect x="757.0" y="40" width="1" height="26" fill="#111"/><rect x="762.0" y="40" width="1" height="26" fill="#111"/><rect x="769.0" y="40" width="2" height="26" fill="#111"/><rect x="778.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0752</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 3</text><text x="118.2" y="133.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 118.2 133.3)">Let the ratio be k : 1</text><text x="39.4" y="133.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q5.</text><text x="118.9" y="165.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 118.9 165.8)">x = (6k − 3)/(k + 1) = −1</text><text x="117.0" y="199.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.20 117.0 199.9)">6k − 3 = −k − 1 ⇒ 7k = 2 ⇒ k = 2/7</text><text x="114.4" y="235.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 114.4 235.2)">Check y: (−8k + 10)/(k + 1) = 6 ✓</text><text x="112.3" y="269.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 112.3 269.6)">∴ Ratio = 2 : 7</text><text x="118.3" y="338.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 118.3 338.4)">6x² − x − 2 = 0;  ac = −12 = (−4)(3)</text><text x="39.2" y="338.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q6.</text><text x="115.1" y="371.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.54 115.1 371.7)">6x² − 4x + 3x − 2 = 0</text><text x="114.6" y="405.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 114.6 405.5)">2x(3x − 2) + 1(3x − 2) = 0</text><text x="119.0" y="440.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 119.0 440.0)">(3x − 2)(2x + 1) = 0</text><text x="117.0" y="472.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.54 117.0 472.5)">x = 2/3  or  x = −1/2</text><text x="115.5" y="539.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 115.5 539.6)">For equal roots, D = b² − 4ac = 0</text><text x="40.2" y="539.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q7.</text><text x="112.5" y="575.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 112.5 575.2)">a = 2, b = k, c = 3 ⇒ k² − 4 × 2 × 3 = 0</text><text x="119.2" y="609.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.42 119.2 609.2)">k² = 24</text><text x="117.8" y="644.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.02 117.8 644.3)">k = ±√24 = ±2√6</text><text x="112.4" y="710.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 112.4 710.8)">Since DE ∥ BC, by BPT: AD/DB = AE/EC</text><text x="39.0" y="710.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q8.</text><text x="118.2" y="743.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.29 118.2 743.7)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="113.7" y="778.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 113.7 778.7)">x(x − 1) = (x + 2)(x − 2)</text><text x="112.9" y="812.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 112.9 812.7)">x² − x = x² − 4</text><text x="117.1" y="848.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 117.1 848.4)">−x = −4 ⇒ x = 4</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
