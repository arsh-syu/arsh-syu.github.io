ze="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 115.7 361.6)">HCF = 2² = 4</text><text x="114.1" y="396.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.04 114.1 396.3)">LCM = 2⁵ × 3 × 101 = 9690</text><text x="112.3" y="462.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 112.3 462.9)">x² − 2x − 8 = x² + 4x − 2x − 8</text><text x="38.6" y="462.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="117.6" y="498.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 117.6 498.0)">= (x + 4)(x − 2) ⇒ zeroes −4, 2</text><text x="118.4" y="530.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 118.4 530.0)">Sum = −2, Product = −8</text><text x="118.8" y="600.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 118.8 600.1)">(1) − (2): 7y = 35</text><text x="38.8" y="600.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="118.0" y="632.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.42 118.0 632.2)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="117.2" y="665.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 117.2 665.7)">∴ x = −2, y = 5</text><text x="114.4" y="733.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 114.4 733.9)">a = 3, d = 12</text><text x="40.3" y="733.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="116.6" y="769.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.43 116.6 769.1)">a₅₄ = 3 + 54 × 12 = 651</text><text x="116.1" y="802.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 116.1 802.3)">651 + 132 = 783</text><text x="118.3" y="837.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 118.3 837.6)">3 + (n − 1)12 = 783 ⇒ n = 66</text><text x="118.0" y="904.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 118.0 904.9)">x = (−3k + 6)/(k + 1) = −1</text><text x="40.4" y="904.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="117.4" y="938.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.38 117.4 938.8)">−3k + 6 = −k − 1 ⇒ k = 7/2</text><text x="112.6" y="972.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 112.6 972.8)">∴ Ratio = 7 : 2</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
