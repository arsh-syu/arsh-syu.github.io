<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">GPS</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">EST. 1998</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">GREENFIELD PUBLIC SCHOOL, PUNE</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Affiliated to CBSE, New Delhi · Affiliation No. 1130457</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">Half-Yearly Examination 2026-27</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">Class X · Mathematics (Standard) · Subject Code 041</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 1½ hours</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 30</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  This question paper contains 9 questions in four sections — A, B, C and D. All questions are</text><text x="72" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">compulsory.</text><text x="52" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Section A has 2 questions of 2 marks each; Section B has 3 questions of 3 marks each.</text><text x="52" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">3.  Section C has 3 questions of 4 marks each; Section D has 1 case-based question of 5 marks.</text><text x="52" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">4.  Show all steps of working. Marks are awarded step-wise as per the CBSE marking scheme.</text><text x="52" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">5.  Use of calculators is not permitted. Draw neat figures wherever required.</text><rect x="40" y="360" width="770" height="28" fill="#f3f4f6"/><text x="425" y="379" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · 2 MARKS EACH</text><text x="44" y="414" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="414" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the HCF and LCM of 96 and 404 by the prime factorisation method.</text><text x="806" y="414" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[2]</text><text x="44" y="453" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="453" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the zeroes of the quadratic polynomial x² − 2x − 8 and verify the relationship</text><text x="76" y="474" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">between the zeroes and the coefficients.</text><text x="806" y="474" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[2]</text><rect x="40" y="503" width="770" height="28" fill="#f3f4f6"/><text x="425" y="522" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · 3 MARKS EACH</text><text x="44" y="557" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="557" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Solve the following pair of linear equations by the elimination method: 2x + 3y = 11</text><text x="76" y="578" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">and 2x − 4y = −24.</text><text x="806" y="578" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><text x="44" y="617" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="617" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Which term of the AP 3, 15, 27, 39, … will be 132 more than its 54th term?</text><text x="806" y="617" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><text x="44" y="656" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="656" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the ratio in which the line segment joining the points (−3, 10) and (6, −8) is</text><text x="76" y="677" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">divided by (−1, 6).</text><text x="806" y="677" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[3]</text><rect x="40" y="706" width="770" height="28" fill="#f3f4f6"/><text x="425" y="725" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION C · 4 MARKS EACH</text><text x="44" y="760" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">6.</text><text x="76" y="760" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the roots of the quadratic equation 6x² − x − 2 = 0 by factorisation.</text><text x="806" y="760" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="799" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">7.</text><text x="76" y="799" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Find the values of k for which the quadratic equation 2x² + kx + 3 = 0 has two equal</text><text x="76" y="820" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">real roots.</text><text x="806" y="820" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="859" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">8.</text><text x="76" y="859" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">In △ABC, DE ∥ BC with D on AB and E on AC. If AD = x, DB = x − 2, AE = x + 2 and EC</text><text x="76" y="880" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">= x − 1, find the value of x.</text><text x="806" y="880" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>