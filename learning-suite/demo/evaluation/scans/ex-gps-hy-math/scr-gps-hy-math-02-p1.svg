× 101</text><text x="117.4" y="360.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.54 117.4 360.6)">HCF = 4</text><text x="112.3" y="396.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 112.3 396.2)">LCM = 96 × 101 = 9696</text><text x="117.0" y="463.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.26 117.0 463.9)">x² − 4x + 2x − 8 = (x − 4)(x + 2)</text><text x="41.1" y="463.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="114.2" y="496.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 114.2 496.3)">zeroes: 4, −2</text><text x="112.0" y="530.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 112.0 530.0)">Sum = 2 = b/a</text><text x="119.2" y="565.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.47 119.2 565.8)">Product = −8 = c/a ✓</text><text x="113.3" y="633.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 113.3 633.2)">(1) − (2): 7y = 35</text><text x="38.7" y="633.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="118.5" y="665.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.47 118.5 665.6)">y = 5 ⇒ 2x = 11 − 15 = −4 ⇒ x = −2</text><text x="113.6" y="701.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 113.6 701.1)">∴ x = −2, y = 5</text><text x="118.0" y="768.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 118.0 768.7)">a = 3, d = 12</text><text x="41.7" y="768.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="113.3" y="801.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.35 113.3 801.9)">a₅₄ = 3 + 54 × 12 = 651</text><text x="112.0" y="835.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 112.0 835.9)">651 + 132 = 783</text><text x="119.4" y="872.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 119.4 872.1)">3 + (n − 1)12 = 783 ⇒ n = 66</text><text x="118.9" y="939.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 118.9 939.4)">Let ratio = k : 1</text><text x="40.4" y="939.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="112.3" y="972.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 112.3 972.0)">(6k − 3)/(k + 1) = −1</text><text x="119.5" y="1006.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 119.5 1006.2)">7k = 2 ⇒ k = 2/7</text><text x="118.6" y="1039.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 118.6 1039.9)">Ratio 2 : 7</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
