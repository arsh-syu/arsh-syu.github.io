rect x="745.0" y="40" width="2" height="26" fill="#111"/><rect x="753.0" y="40" width="3" height="26" fill="#111"/><rect x="758.0" y="40" width="3" height="26" fill="#111"/><rect x="762.0" y="40" width="1" height="26" fill="#111"/><rect x="767.0" y="40" width="1" height="26" fill="#111"/><rect x="774.0" y="40" width="2" height="26" fill="#111"/><rect x="783.0" y="40" width="2" height="26" fill="#111"/><text x="715" y="83" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0739</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 2 of 3</text><text x="114.6" y="131.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.30 114.6 131.7)">Let the ratio be k : 1</text><text x="38.3" y="131.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q5.</text><text x="117.2" y="167.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.49 117.2 167.5)">x = (6k − 3)/(k + 1) = −1</text><text x="114.7" y="201.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 114.7 201.2)">6k − 3 = −k − 1 ⇒ 7k = 2 ⇒ k = 2/7</text><text x="119.7" y="235.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 119.7 235.2)">Check y: (−8k + 10)/(k + 1) = 6 ✓</text><text x="118.6" y="268.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 118.6 268.5)">∴ Ratio = 2 : 7</text><text x="112.6" y="335.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 112.6 335.8)">6x² − x − 2 = 0;  ac = −12 = (−4)(3)</text><text x="42.8" y="335.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="116.5" y="371.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 116.5 371.8)">6x² − 4x + 3x − 2 = 0</text><text x="114.5" y="403.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.43 114.5 403.8)">2x(3x − 2) + 1(3x − 2) = 0</text><text x="114.1" y="439.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 114.1 439.4)">(3x − 2)(2x + 1) = 0</text><text x="119.7" y="474.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 119.7 474.5)">x = 2/3  or  x = −1/2</text><text x="119.3" y="542.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 119.3 542.4)">For equal roots, D = b² − 4ac = 0</text><text x="38.9" y="542.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q7.</text><text x="115.4" y="575.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 115.4 575.8)">a = 2, b = k, c = 3 ⇒ k² − 4 × 2 × 3 = 0</text><text x="118.6" y="609.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 118.6 609.7)">k² = 24</text><text x="112.2" y="642.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.42 112.2 642.7)">k = ±√24 = ±2√6</text><text x="113.8" y="711.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 113.8 711.5)">Since DE ∥ BC, by BPT: AD/DB = AE/EC</text><text x="40.5" y="711.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q8.</text><text x="116.5" y="744.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 116.5 744.6)">x/(x − 2) = (x + 2)/(x − 1)</text><text x="117.4" y="778.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.24 117.4 778.6)">x(x − 1) = (x + 2)(x − 2)</text><text x="113.8" y="814.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 113.8 814.2)">x² − x = x² − 4</text><text x="115.6" y="847.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 115.6 847.5)">−x = −4 ⇒ x = 4</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
<rect x="14" y="12" width="822" height="1076" fill="url(#vig)"/>
</g></svg>