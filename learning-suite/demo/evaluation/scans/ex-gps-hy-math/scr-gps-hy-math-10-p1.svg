-serif" font-size="11.5" fill="#6b7280">Identity masked for on-screen evaluation — do not write your name.</text><text x="44" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#374151">Invigilator's signature:</text><line x1="213.2" y1="273" x2="374" y2="273" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2 2"/><path d="M 230 266 c 10 -14 18 6 26 -4 s 12 -10 20 2 s 14 4 22 -6" stroke="#111827" stroke-width="1.4" fill="none"/><rect x="554" y="110" width="242" height="84" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/><rect x="560.0" y="116" width="3" height="54" fill="#111"/><rect x="568.0" y="116" width="2" height="54" fill="#111"/><rect x="573.0" y="116" width="2" height="54" fill="#111"/><rect x="577.0" y="116" width="2" height="54" fill="#111"/><rect x="581.0" y="116" width="3" height="54" fill="#111"/><rect x="590.0" y="116" width="3" height="54" fill="#111"/><rect x="595.0" y="116" width="3" height="54" fill="#111"/><rect x="600.0" y="116" width="2" height="54" fill="#111"/><rect x="603.0" y="116" width="3" height="54" fill="#111"/><rect x="611.0" y="116" width="2" height="54" fill="#111"/><rect x="618.0" y="116" width="3" height="54" fill="#111"/><rect x="622.0" y="116" width="1" height="54" fill="#111"/><rect x="629.0" y="116" width="2" height="54" fill="#111"/><rect x="633.0" y="116" width="2" height="54" fill="#111"/><rect x="637.0" y="116" width="3" height="54" fill="#111"/><rect x="642.0" y="116" width="2" height="54" fill="#111"/><rect x="650.0" y="116" width="3" height="54" fill="#111"/><rect x="655.0" y="116" width="2" height="54" fill="#111"/><rect x="664.0" y="116" width="1" height="54" fill="#111"/><rect x="666.0" y="116" width="2" height="54" fill="#111"/><rect x="673.0" y="116" width="3" height="54" fill="#111"/><rect x="677.0" y="116" width="1" height="54" fill="#111"/><rect x="682.0" y="116" width="1" height="54" fill="#111"/><rect x="689.0" y="116" width="2" height="54" fill="#111"/><rect x="698.0" y="116" width="2" height="54" fill="#111"/><rect x="711.0" y="116" width="2" height="54" fill="#111"/><rect x="720.0" y="116" width="1" height="54" fill="#111"/><rect x="726.0" y="116" width="1" height="54" fill="#111"/><rect x="728.0" y="116" width="3" height="54" fill="#111"/><rect x="734.0" y="116" width="2" height="54" fill="#111"/><rect x="738.0" y="116" width="1" height="54" fill="#111"/><rect x="745.0" y="116" width="2" height="54" fill="#111"/><rect x="757.0" y="116" width="3" height="54" fill="#111"/><rect x="766.0" y="116" width="2" height="54" fill="#111"/><rect x="770.0" y="116" width="3" height="54" fill="#111"/><rect x="780.0" y="116" width="1" height="54" fill="#111"/><rect x="782.0" y="116" width="3" height="54" fill="#111"/><text x="675" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#111" letter-spacing="1">GPS-HY26-M-0394</text><text x="675" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">MASKED ROLL NO. (scan label)</text><rect x="560" y="226" width="230" height="44" fill="none" stroke="#9ca3af"/><text x="572" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">FOR EXAMINER'S USE ONLY</text><text x="425" y="1066" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1 of 3</text><text x="119.3" y="293.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 119.3 293.9)">96 = 2 × 2 × 2 × 2 × 2 × 3 = 2⁵ × 3</text><text x="41.8" y="293.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q1.</text><text x="117.5" y="327.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 117.5 327.0)">404 = 2 × 2 × 101 = 2² × 101</text><text x="116.0" y="361.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 116.0 361.7)">HCF = 2² = 4</text><text x="119.9" y="395.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 119.9 395.7)">LCM = 2⁵ × 3 × 101 = 9696</text><text x="113.3" y="461.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 113.3 461.6)">x² − 2x − 8 = x² − 4x + 2x − 8</text><text x="38.1" y="461.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q2.</text><text x="119.7" y="497.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.24 119.7 497.0)">= (x − 4)(x + 2) ⇒ zeroes are 4, −2</text><text x="113.4" y="529.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 113.4 529.8)">Sum = 4 + (−2) = 2 = −(−2)/1 = −b/a ✓</text><text x="112.6" y="566.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 112.6 566.0)">Product = 4 × (−2) = −8 = c/a ✓</text><text x="112.9" y="631.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 112.9 631.6)">2x + 3y = 11 …(1),  2x − 4y = −24 …(2)</text><text x="41.8" y="631.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q3.</text><text x="115.8" y="668.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 115.8 668.1)">(1) − (2): 7y = 35</text><text x="119.7" y="702.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.22 119.7 702.0)">y = 5;  2x + 15 = 11 ⇒ x = −2</text><text x="114.5" y="735.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.29 114.5 735.8)">Check: 2(−2) − 4(5) = −24 ✓</text><text x="119.6" y="770.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.21 119.6 770.2)">∴ x = −2, y = 5</text><text x="114.8" y="837.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 114.8 837.9)">a = 3, d = 15 − 3 = 12</text><text x="42.7" y="837.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q4.</text><text x="117.2" y="871.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 117.2 871.5)">a₅₄ = a + 53d = 3 + 53 × 12 = 639</text><text x="113.3" y="905.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 113.3 905.8)">Required term = 639 + 132 = 771</text><text x="116.2" y="937.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 116.2 937.6)">3 + (n − 1)12 = 771 ⇒ n − 1 = 64</text><text x="113.7" y="972.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 113.7 972.0)">n = 65  ∴ 65th term</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
