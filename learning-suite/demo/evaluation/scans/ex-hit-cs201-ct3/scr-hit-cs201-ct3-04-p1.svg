ve" style="white-space:pre" transform="rotate(-0.03 117.1 292.8)">reverse(head):</text><text x="43.3" y="292.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q1.</text><text x="112.2" y="326.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 112.2 326.6)">  prev = NULL; curr = head</text><text x="115.3" y="361.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 115.3 361.3)">  while curr != NULL:</text><text x="116.0" y="395.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 116.0 395.6)">    next = curr.next</text><text x="115.4" y="429.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 115.4 429.2)">    curr.next = prev</text><text x="113.6" y="463.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 113.6 463.3)">    prev = curr; curr = next</text><text x="119.5" y="496.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 119.5 496.7)">  head = prev; return head</text><text x="115.7" y="530.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 115.7 530.7)">Time: O(n),  Space: O(1)</text><text x="113.8" y="597.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 113.8 597.8)">Linear queue wastes space at the front.</text><text x="40.6" y="597.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q2.</text><text x="116.7" y="632.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.41 116.7 632.5)">enqueue(x):</text><text x="114.6" y="665.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 114.6 665.8)">  if rear == N − 1: overflow</text><text x="112.5" y="700.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 112.5 700.2)">  rear = (rear + 1) % N; Q[rear] = x</text><text x="118.9" y="769.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 118.9 769.4)">Postorder: 15 35 25 55 75 65 45</text><text x="40.6" y="769.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q3.</text><text x="119.5" y="801.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 119.5 801.9)">25 has two children → successor = 35</text><text x="117.2" y="837.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.02 117.2 837.7)">Replace 25 by 35, delete leaf 35</text><text x="114.9" y="872.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 114.9 872.0)">            45</text><text x="119.0" y="906.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 119.0 906.1)">        /        \</text><text x="119.3" y="939.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 119.3 939.0)">      35          65</text><text x="117.1" y="972.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.54 117.1 972.4)">     /          /    \</text><text x="114.9" y="1005.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 114.9 1005.6)">   15         55      75</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
