<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">HIT</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">EST. 1998</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">HORIZON INSTITUTE OF TECHNOLOGY, BENGALURU</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Department of Computer Science &amp; Engineering</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">Class Test 3 — September 2026</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">B.Tech CSE · Semester 3 · CS201 Data Structures</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 45 minutes</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 15</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  Answer all three questions. Pseudo-code in any C-like notation is acceptable.</text><rect x="40" y="265" width="770" height="28" fill="#f3f4f6"/><text x="425" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">PART A · 5 MARKS EACH</text><text x="44" y="319" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="319" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Write an algorithm to reverse a singly linked list in place. State its time and</text><text x="76" y="340" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">space complexity.</text><text x="806" y="340" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="44" y="379" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="379" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">How does a circular queue overcome the limitation of a linear queue? Write the</text><text x="76" y="400" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">enqueue operation for a circular queue of size N.</text><text x="806" y="400" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="44" y="439" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="439" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Build a BST from 45, 25, 65, 15, 35, 55, 75. Write its postorder traversal, then</text><text x="76" y="460" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">delete 25 and draw the resulting tree.</text><text x="806" y="460" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[5]</text><text x="425" y="509" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" letter-spacing="2">*** END OF QUESTION PAPER ***</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>