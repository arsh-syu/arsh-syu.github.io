S, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 116.1 293.1)">reverse(head):</text><text x="38.0" y="293.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q1.</text><text x="113.2" y="327.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 113.2 327.8)">  prev = NULL; curr = head</text><text x="115.9" y="361.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 115.9 361.4)">  while curr != NULL:</text><text x="113.0" y="395.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 113.0 395.1)">    next = curr.next</text><text x="114.5" y="427.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 114.5 427.8)">    curr.next = prev</text><text x="118.9" y="462.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 118.9 462.1)">    prev = curr; curr = next</text><text x="113.1" y="498.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 113.1 498.2)">  head = prev; return head</text><text x="118.4" y="530.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.16 118.4 530.9)">Time: O(n),  Space: O(1)</text><text x="113.7" y="600.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 113.7 600.2)">Linear queue wastes space at the front.</text><text x="42.9" y="600.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q2.</text><text x="115.7" y="633.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.28 115.7 633.3)">enqueue(x):</text><text x="114.5" y="666.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.24 114.5 666.7)">  if rear == N − 1: overflow</text><text x="116.9" y="700.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 116.9 700.6)">  rear = (rear + 1) % N; Q[rear] = x</text><text x="113.1" y="768.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.01 113.1 768.3)">Postorder: 15 35 25 55 75 65 45</text><text x="43.6" y="768.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q3.</text><text x="117.3" y="801.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.36 117.3 801.9)">25 has two children → successor = 35</text><text x="120.0" y="837.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 120.0 837.0)">Replace 25 by 35, delete leaf 35</text><text x="116.0" y="870.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 116.0 870.1)">            45</text><text x="118.4" y="906.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.46 118.4 906.2)">        /        \</text><text x="114.1" y="939.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 114.1 939.1)">      35          65</text><text x="118.8" y="973.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.14 118.8 973.3)">     /          /    \</text><text x="118.6" y="1006.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.21 118.6 1006.9)">   15         55      75</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
