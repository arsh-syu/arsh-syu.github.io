92.8)">prev = NULL, curr = head</text><text x="38.1" y="292.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q1.</text><text x="119.6" y="325.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 119.6 325.9)">while curr: nxt = curr.next</text><text x="114.0" y="360.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.51 114.0 360.8)">  curr.next = prev; prev = curr; curr = nxt</text><text x="115.3" y="395.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.39 115.3 395.1)">head = prev</text><text x="115.4" y="429.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 115.4 429.8)">Time O(n), Space O(n)</text><text x="115.3" y="498.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.50 115.3 498.2)">Linear queue wastes space at the front.</text><text x="42.8" y="498.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="113.6" y="532.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.00 113.6 532.4)">enqueue(x):</text><text x="116.8" y="565.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 116.8 565.2)">  if rear == N − 1: overflow</text><text x="114.9" y="600.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 114.9 600.1)">  rear = (rear + 1) % N; Q[rear] = x</text><text x="117.3" y="668.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 117.3 668.2)">Postorder: 15 25 35 55 65 75 45</text><text x="38.5" y="668.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="113.3" y="700.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.01 113.3 700.2)">Delete 25: replace with 35</text><text x="116.7" y="733.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.08 116.7 733.9)">      45</text><text x="112.3" y="769.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.43 112.3 769.0)">   35     65</text><text x="116.8" y="803.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 116.8 803.1)"> 15     55   75</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
