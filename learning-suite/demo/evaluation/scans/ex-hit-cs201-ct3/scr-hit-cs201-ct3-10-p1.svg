3.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q1.</text><text x="115.9" y="328.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.07 115.9 328.4)">while curr: nxt = curr.next</text><text x="117.8" y="361.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 117.8 361.3)">  curr.next = prev; prev = curr; curr = nxt</text><text x="112.8" y="394.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 112.8 394.3)">head = prev</text><text x="117.3" y="428.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 117.3 428.9)">Time O(n), Space O(n)</text><text x="116.9" y="496.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.20 116.9 496.8)">Linear queue wastes space at the front.</text><text x="41.7" y="496.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q2.</text><text x="114.3" y="530.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.36 114.3 530.8)">enqueue(x):</text><text x="112.5" y="565.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 112.5 565.3)">  if rear == N − 1: overflow</text><text x="119.9" y="598.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 119.9 598.6)">  rear = (rear + 1) % N; Q[rear] = x</text><text x="115.1" y="665.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 115.1 665.6)">Postorder: 15 35 25 55 75 65 45</text><text x="43.5" y="665.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q3.</text><text x="115.2" y="701.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 115.2 701.3)">25 has two children → successor = 35</text><text x="118.5" y="735.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 118.5 735.8)">Replace 25 by 35, delete leaf 35</text><text x="112.8" y="768.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 112.8 768.4)">            45</text><text x="112.5" y="803.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.13 112.5 803.6)">        /        \</text><text x="116.0" y="836.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.24 116.0 836.1)">      35          65</text><text x="113.9" y="872.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic