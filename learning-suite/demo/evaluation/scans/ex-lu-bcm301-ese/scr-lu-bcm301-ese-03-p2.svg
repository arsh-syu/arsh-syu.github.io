e" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 112.7 268.3)">Nominal value redeemed       5,00,000</text><text x="113.4" y="303.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.18 113.4 303.7)">Less: proceeds of fresh issue 2,00,000</text><text x="113.1" y="337.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.29 113.1 337.2)">Transfer to CRR              3,00,000</text><text x="115.3" y="372.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 115.3 372.0)">General Reserve Dr 3,00,000 To CRR 3,00,000</text><text x="113.2" y="438.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 113.2 438.6)">(a) Non-current liab. – Long-term borrowings</text><text x="39.5" y="438.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="113.8" y="472.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 113.8 472.7)">(b) Non-current assets – PPE</text><text x="117.8" y="506.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 117.8 506.1)">(c) Current liab. – Trade payables</text><text x="118.7" y="539.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 118.7 539.7)">(d) Current liab. – Other current liabilities</text><text x="116.6" y="574.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.41 116.6 574.2)">(e) Current liab. – Short-term provisions</text><text x="117.7" y="608.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 117.7 608.6)">(f) Non-current assets – Intangible assets</text><text x="113.1" y="642.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 113.1 642.3)">(g) Current liab. – Other current liab.</text><text x="112.2" y="676.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.16 112.2 676.4)">(h) Current liab. – Short-term borrowings</text><text x="118.0" y="744.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 118.0 744.7)">Own Debentures A/c Dr 96,000</text><text x="41.8" y="744.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q5.</text><text x="112.4" y="778.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.25 112.4 778.5)">Debenture Interest A/c Dr 10,000</text><text x="117.9" y="812.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform