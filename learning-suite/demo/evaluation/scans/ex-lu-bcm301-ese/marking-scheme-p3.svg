ly="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.5.3</text><text x="800" y="158" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3</text><line x1="56" y1="165" x2="800" y2="165" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. Unrealised profit ₹6,000 eliminated and mutual owing of ₹40,000 cancelled</text><text x="710" y="182" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.5.2</text><text x="800" y="182" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3</text><line x1="56" y1="189" x2="800" y2="189" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">5. Items presented correctly in the consolidated balance sheet</text><text x="710" y="206" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.5.3</text><text x="800" y="206" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3</text><line x1="56" y1="213" x2="800" y2="213" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="232" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: Capital profit 1,00,000; revenue profit 1,50,000. Minority interest (20%) = 1,00,000 + 20,000 + 30,000 =</text><text x="56" y="249" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">1,50,000. Cost of control: 5,60,000 − 80% of 6,00,000 = goodwill 80,000. Unrealised profit 30,000 ×</text><text x="56" y="266" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">25/125 = 6,000; mutual owing of 40,000 cancelled. Consolidated P&amp;L: H's share of revenue profit 1,20,000</text><text x="56" y="283" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">less 6,000.</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Marking scheme · page 3</text></svg>