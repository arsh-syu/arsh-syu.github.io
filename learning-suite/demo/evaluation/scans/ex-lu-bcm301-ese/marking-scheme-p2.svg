><text x="800" y="307" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="314" x2="800" y2="314" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Net assets after outside liabilities: ₹10,00,000</text><text x="710" y="331" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.1</text><text x="800" y="331" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="338" x2="800" y2="338" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Preference share capital deducted: ₹8,00,000 for equity</text><text x="710" y="355" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.1</text><text x="800" y="355" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="362" x2="800" y2="362" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. Intrinsic value ₹16 per equity share</text><text x="710" y="379" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.1</text><text x="800" y="379" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="386" x2="800" y2="386" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="405" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: Assets excluding goodwill 12,00,000 + goodwill 1,00,000 = 13,00,000; less liabilities 3,00,000 =</text><text x="56" y="422" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">10,00,000; less preference capital 2,00,000 = 8,00,000; ÷ 50,000 = ₹16 per share.</text><rect x="40" y="440" width="770" height="26" fill="#f3f4f6"/><text x="50" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q7 · Section B</text><text x="800" y="458" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">8 marks</text><text x="56" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Purchase consideration ₹7,50,000 by the net assets method</text><text x="710" y="487" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.1</text><text x="800" y="487" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="494" x2="800" y2="494" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="511" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Number of shares issued: 40,000</text><text x="710" y="511" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.1</text><text x="800" y="511" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="518" x2="800" y2="518" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Business Purchase entry for ₹7,50,000</text><text x="710" y="535" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.2</text><text x="800" y="535" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="542" x2="800" y2="542" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. Discharge of consideration with Securities Premium ₹2,00,000</text><text x="710" y="559" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.4.2</text><text x="800" y="559" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="566" x2="800" y2="566" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="585" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: PC = 9,00,000 − 1,50,000 = ₹7,50,000. Shares = 6,00,000 ÷ 15 = 40,000. Business Purchase Dr 7,50,000 To</text><text x="56" y="602" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Liquidator 7,50,000; Liquidator Dr 7,50,000 To Bank 1,50,000, To Equity Share Capital 4,00,000, To</text><text x="56" y="619" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Securities Premium 2,00,000.</text><rect x="40" y="637" width="770" height="26" fill="#f3f4f6"/><text x="50" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q8 · Section C</text><text x="800" y="655" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">15 marks</text><text x="56" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Revenue from operations and other income: total ₹15,40,000</text><text x="710" y="684" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.1</text><text x="800" y="684" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="691" x2="800" y2="691" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Expenses including depreciation ₹50,000: total ₹11,80,000</text><text x="710" y="708" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.1</text><text x="800" y="708" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3</text><line x1="56" y1="715" x2="800" y2="715" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Managerial remuneration ₹18,000 at 5%</text><text x="710" y="732" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.3</text><text x="800" y="732" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="739" x2="800" y2="739" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="756" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. Tax ₹60,000 and profit for the year ₹2,82,000</text><text x="710" y="756" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.3</text><text x="800" y="756" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="763" x2="800" y2="763" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">5. Proposed dividend disclosed in notes, not as a liability</text><text x="710" y="780" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.3</text><text x="800" y="780" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="787" x2="800" y2="787" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">6. Balance sheet in the Schedule III format</text><text x="710" y="804" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df