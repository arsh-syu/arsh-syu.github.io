<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><text x="44" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">UNIVERSITY OF LUCKNOW (DEMO) · Paper BCM-301 · Corporate Accounting (demo paper code)</text><text x="806" y="44" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239" letter-spacing="1">CONFIDENTIAL · FOR EXAMINERS</text><rect x="40" y="63" width="770" height="26" fill="#f3f4f6"/><text x="50" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q5 · Section B</text><text x="800" y="81" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">8 marks</text><text x="56" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Purchase of own debentures recorded at cost ₹96,000</text><text x="710" y="110" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.2.3</text><text x="800" y="110" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="117" x2="800" y2="117" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Accrued interest for 6 months ₹5,000 paid</text><text x="710" y="134" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.2.3</text><text x="800" y="134" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="141" x2="800" y2="141" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Cancellation entry with profit ₹4,000</text><text x="710" y="158" text-anchor="end" font-family="Co