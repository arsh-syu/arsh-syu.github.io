<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><circle cx="96" cy="78" r="34" fill="none" stroke="#1f2937" stroke-width="2"/><text x="96" y="73" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-weight="bold" fill="#1f2937">LU</text><text x="96" y="91" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#1f2937">DEMO</text><text x="455" y="64" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" fill="#111827">UNIVERSITY OF LUCKNOW (DEMO)</text><text x="455" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Office of the Controller of Examinations · Lucknow, Uttar Pradesh · demo paper</text><text x="455" y="114" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="bold" fill="#111827">B.Com III Semester End-Semester Examination 2026-27</text><text x="455" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111827">Paper BCM-301 · Corporate Accounting (demo paper code)</text><line x1="40" y1="156" x2="810" y2="156" stroke="#111827" stroke-width="1.5"/><text x="44" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Time allowed: 3 hours</text><text x="806" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">Maximum Marks: 70</text><line x1="40" y1="190" x2="810" y2="190" stroke="#111827" stroke-width="1"/><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">General Instructions:</text><text x="52" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">1.  Attempt all questions. The question paper has three sections: A, B and C.</text><text x="52" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">2.  Section A has 4 short-answer questions of 4 marks each. Section B has 3 questions of 8 marks</text><text x="72" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">each.</text><text x="52" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">3.  Section C has 2 long-answer questions of 15 marks each.</text><text x="52" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">4.  Show working notes wherever necessary. Marks are awarded step-wise as per the marking</text><text x="72" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">scheme.</text><text x="52" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">5.  Figures in the margin indicate full marks. All companies named in this paper are fictional.</text><text x="52" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">6.  Write only your masked roll number on the answer book. Do not write your name anywhere.</text><rect x="40" y="398" width="770" height="28" fill="#f3f4f6"/><text x="425" y="417" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION A · SHORT ANSWERS · 4 MARKS EACH</text><text x="44" y="452" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">1.</text><text x="76" y="452" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Sahu Textiles Ltd issued 20,000 equity shares of ₹10 each at a premium of ₹2 per</text><text x="76" y="473" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">share, payable ₹3 on application and ₹5 on allotment (including the premium). All</text><text x="76" y="494" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">shares were subscribed and the money was duly received. Pass journal entries for</text><text x="76" y="515" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">application and allotment.</text><text x="806" y="515" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="554" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">2.</text><text x="76" y="554" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Mehrotra Foods Ltd forfeited 300 equity shares of ₹10 each (₹8 called up) on which</text><text x="76" y="575" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">₹5 per share had been paid. Of these, 200 shares were reissued as fully paid at ₹7</text><text x="76" y="596" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">per share. Pass journal entries and show the amount transferred to Capital Reserve.</text><text x="806" y="596" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="635" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">3.</text><text x="76" y="635" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Explain the purpose of the Capital Redemption Reserve under Section 55 of the</text><text x="76" y="656" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Companies Act, 2013. A company redeems ₹5,00,000 preference shares at par, partly</text><text x="76" y="677" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">out of the proceeds of a fresh issue of ₹2,00,000 equity shares at par. Calculate</text><text x="76" y="698" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">the amount to be transferred to the Capital Redemption Reserve.</text><text x="806" y="698" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><text x="44" y="737" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">4.</text><text x="76" y="737" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Under Schedule III to the Companies Act, 2013, state the heading and sub-heading</text><text x="76" y="758" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">under which each item appears: (a) debentures repayable after 5 years, (b) loose</text><text x="76" y="779" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">tools, (c) bills payable, (d) calls in advance, (e) provision for tax, (f) patents,</text><text x="76" y="800" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">(g) unpaid dividend, (h) bank overdraft.</text><text x="806" y="800" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[4]</text><rect x="40" y="829" width="770" height="28" fill="#f3f4f6"/><text x="425" y="848" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">SECTION B · 8 MARKS EACH</text><text x="44" y="883" font-family="Georgia, Times New Roman, serif" font-size="15" font-weight="bold" fill="#111827">5.</text><text x="76" y="883" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">Awasthi Motors Ltd had ₹4,00,000 10% debentures, with interest payable on 31 March.</text><text x="76" y="904" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">On 1 October 2025 it purchased ₹1,00,000 of its own debentures in the open market at</text><text x="76" y="925" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">₹96 ex-interest for immediate cancellation. Pass journal entries for the purchase,</text><text x="76" y="946" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#111827">the cancellation and the transfer of profit on cancellation.</text><text x="806" y="946" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">[8]</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Page 1</text></svg>