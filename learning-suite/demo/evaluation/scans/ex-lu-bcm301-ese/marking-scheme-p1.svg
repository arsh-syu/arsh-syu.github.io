<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#ffffff"/><text x="44" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">UNIVERSITY OF LUCKNOW (DEMO) · Paper BCM-301 · Corporate Accounting (demo paper code)</text><text x="806" y="44" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239" letter-spacing="1">CONFIDENTIAL · FOR EXAMINERS</text><text x="425" y="90" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" fill="#111827">Marking scheme</text><text x="425" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">B.Com III Semester End-Semester Examination 2026-27</text><text x="44" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">Award marks step-wise. Give method marks where the approach is right but a figure is wrong</text><text x="44" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4b5563">(follow-through). Each step is mapped to a course outcome (CO) of the paper.</text><rect x="40" y="173" width="770" height="26" fill="#f3f4f6"/><text x="50" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q1 · Section A</text><text x="800" y="191" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">4 marks</text><text x="56" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Application money received: Bank Dr ₹60,000</text><text x="710" y="220" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.1</text><text x="800" y="220" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="227" x2="800" y2="227" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Application transferred to Share Capital ₹60,000</text><text x="710" y="244" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.1</text><text x="800" y="244" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="251" x2="800" y2="251" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Allotment due: Share Capital ₹60,000 and Securities Premium ₹40,000</text><text x="710" y="268" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.1</text><text x="800" y="268" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="275" x2="800" y2="275" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. Allotment money received ₹1,00,000</text><text x="710" y="292" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.1</text><text x="800" y="292" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="299" x2="800" y2="299" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="318" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: Bank Dr 60,000 To Equity Share Application 60,000; Application Dr 60,000 To Share Capital 60,000;</text><text x="56" y="335" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Allotment Dr 1,00,000 To Share Capital 60,000 and To Securities Premium 40,000; Bank Dr 1,00,000 To</text><text x="56" y="352" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Allotment 1,00,000.</text><rect x="40" y="370" width="770" height="26" fill="#f3f4f6"/><text x="50" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q2 · Section A</text><text x="800" y="388" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">4 marks</text><text x="56" y="417" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Forfeiture entry at called-up value ₹2,400</text><text x="710" y="417" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.2</text><text x="800" y="417" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1.5</text><line x1="56" y1="424" x2="800" y2="424" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="441" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. Reissue entry: Bank ₹1,400, Forfeiture ₹600</text><text x="710" y="441" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.2</text><text x="800" y="441" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1.5</text><line x1="56" y1="448" x2="800" y2="448" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Capital Reserve ₹400 on the reissued shares only</text><text x="710" y="465" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.1.2</text><text x="800" y="465" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="472" x2="800" y2="472" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="491" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: Share Capital Dr 2,400 To Calls-in-arrears 900 To Share Forfeiture 1,500. Bank Dr 1,400, Share</text><text x="56" y="508" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Forfeiture Dr 600 To Share Capital 2,000. Forfeiture on 200 shares ₹1,000 less discount ₹600 = ₹400 to</text><text x="56" y="525" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Capital Reserve.</text><rect x="40" y="543" width="770" height="26" fill="#f3f4f6"/><text x="50" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q3 · Section A</text><text x="800" y="561" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">4 marks</text><text x="56" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. Purpose: capital is not reduced, creditors stay protected</text><text x="710" y="590" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.2.1</text><text x="800" y="590" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="597" x2="800" y2="597" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. CRR can be used only for fully paid bonus shares</text><text x="710" y="614" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.2.1</text><text x="800" y="614" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="621" x2="800" y2="621" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. Transfer to CRR = ₹3,00,000, with entry</text><text x="710" y="638" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.2.2</text><text x="800" y="638" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2</text><line x1="56" y1="645" x2="800" y2="645" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="664" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: CRR keeps the capital base intact when preference shares are redeemed out of profits, protecting</text><text x="56" y="681" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">creditors; it can be used only to issue fully paid bonus shares. Transfer = 5,00,000 − 2,00,000 =</text><text x="56" y="698" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">₹3,00,000.</text><rect x="40" y="716" width="770" height="26" fill="#f3f4f6"/><text x="50" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111827">Q4 · Section A</text><text x="800" y="734" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">4 marks</text><text x="56" y="763" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1. (a) and (b) classified correctly</text><text x="710" y="763" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.2</text><text x="800" y="763" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="770" x2="800" y2="770" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="787" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2. (c) and (d) classified correctly</text><text x="710" y="787" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.2</text><text x="800" y="787" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="794" x2="800" y2="794" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">3. (e) and (f) classified correctly</text><text x="710" y="811" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.2</text><text x="800" y="811" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="818" x2="800" y2="818" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="835" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">4. (g) and (h) classified correctly</text><text x="710" y="835" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#6a4df5">BCM301.3.2</text><text x="800" y="835" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">1</text><line x1="56" y1="842" x2="800" y2="842" stroke="#e5e7eb" stroke-width="0.8"/><text x="56" y="861" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">Model answer: (a) Non-current liabilities – long-term borrowings; (b) current assets – inventories; (c) current</text><text x="56" y="878" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">liabilities – trade payables; (d) and (g) current liabilities – other current liabilities; (e) current</text><text x="56" y="895" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">liabilities – short-term provisions; (f) non-current assets – intangible assets; (h) current liabilities</text><text x="56" y="912" font-family="Georgia, Times New Roman, serif" font-size="12.5" font-style="italic" fill="#4b5563">– short-term borrowings.</text><text x="425" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Marking scheme · page 1</text></svg>