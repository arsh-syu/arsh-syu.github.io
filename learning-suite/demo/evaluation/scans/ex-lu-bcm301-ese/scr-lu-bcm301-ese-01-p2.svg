 Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.33 112.9 574.2)">   To Own Debentures 96,000, To Profit 4,000</text><text x="117.1" y="607.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 117.1 607.9)">Profit on Cancellation Dr 4,000 To Capital Reserve 4,000</text><text x="113.6" y="677.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.23 113.6 677.1)">Assets 12,00,000 + 1,00,000 = 13,00,000</text><text x="41.8" y="677.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q6.</text><text x="118.2" y="712.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 118.2 712.4)">Less liabilities 3,00,000 = 10,00,000</text><text x="115.4" y="746.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 115.4 746.0)">Value per share = 10,00,000 ÷ 50,000 = ₹20</text><text x="115.2" y="811.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 115.2 811.5)">PC = 9,00,000 − 1,50,000 = 7,50,000</text><text x="42.7" y="811.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q7.</text><text x="116.5" y="848.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 116.5 848.3)">Shares = 6,00,000 ÷ 10 = 60,000</text><text x="117.7" y="881.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 117.7 881.8)">Business Purchase A/c Dr 7,50,000</text><text x="117.4" y="916.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 117.4 916.0)">   To Liquidator 7,50,000</text><text x="116.1" y="949.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 116.1 949.9)">Liquidator Dr 7,50,000</text><text x="115.1" y="984.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.24 115.1 984.3)">   To Bank 1,50,000, To Share Capital 6,00,000</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
