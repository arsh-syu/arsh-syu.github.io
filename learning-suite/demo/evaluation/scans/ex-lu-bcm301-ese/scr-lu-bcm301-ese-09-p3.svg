="preserve" style="white-space:pre" transform="rotate(0.15 112.2 269.1)">Profit 3,60,000 − Tax 60,000 = 3,00,000</text><text x="113.2" y="303.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 113.2 303.6)">MR @ 5% of 3,00,000 = 15,000</text><text x="112.4" y="337.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 112.4 337.9)">Profit for the year = 2,85,000</text><text x="113.0" y="372.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 113.0 372.2)">Proposed dividend 1,00,000 in notes to accounts</text><text x="118.4" y="405.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 118.4 405.2)">BS: Share capital 10,00,000; R&amp;S 2,85,000</text><text x="117.4" y="439.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 117.4 439.7)">PPE 4,50,000; current assets</text><text x="113.8" y="472.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.09 113.8 472.9)">Non-current and current items separated</text><text x="115.3" y="540.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 115.3 540.3)">Pre-acquisition 1,00,000; post-acq. 1,50,000</text><text x="41.0" y="540.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q9.</text><text x="114.0" y="574.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.37 114.0 574.7)">MI = 20% of 7,50,000 = 1,50,000</text><text x="114.0" y="609.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 114.0 609.7)">Goodwill = 5,60,000 − 4,80,000 = 80,000</text><text x="119.7" y="642.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.52 119.7 642.4)">Unrealised profit = 25% of 30,000 = 7,500</text><text x="116.2" y="677.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.11 116.2 677.0)">Mutual owing 40,000 cancelled</text><text x="118.8" y="711.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 118.8 711.9)">CBS: Goodwill 80,000, MI 1,50,000, stock − 7,500</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
