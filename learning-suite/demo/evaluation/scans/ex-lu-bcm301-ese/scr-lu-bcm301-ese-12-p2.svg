" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 119.4 269.3)">Nominal value redeemed       5,00,000</text><text x="115.6" y="302.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 115.6 302.8)">Less: proceeds of fresh issue 2,00,000</text><text x="118.4" y="336.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 118.4 336.3)">Transfer to CRR              3,00,000</text><text x="113.8" y="371.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.29 113.8 371.4)">General Reserve Dr 3,00,000 To CRR 3,00,000</text><text x="116.5" y="438.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 116.5 438.3)">(a) Non-current liab. – Long-term borrowings</text><text x="43.5" y="438.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="114.6" y="474.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 114.6 474.0)">(b) Current assets – Inventories</text><text x="113.5" y="507.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 113.5 507.7)">(c) Current liab. – Trade payables</text><text x="114.7" y="539.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" sty