rm="rotate(0.11 116.0 270.5)">Liquidator Dr 7,50,000</text><text x="116.0" y="302.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 116.0 302.0)">   To Bank 1,50,000, To Share Capital 6,00,000</text><text x="115.0" y="371.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.15 115.0 371.1)">Revenue 15,00,000 + Other income 40,000</text><text x="38.5" y="371.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q8.</text><text x="117.0" y="404.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 117.0 404.1)">   = 15,40,000</text><text x="114.6" y="437.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 114.6 437.7)">Expenses 11,30,000 + Depreciation 50,000</text><text x="118.3" y="474.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 118.3 474.2)">   = 11,80,000</text><text x="114.5" y="506.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 114.5 506.4)">Profit 3,60,000 − Tax 60,000 = 3,00,000</text><text x="114.5" y="539.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 114.5 539.5)">MR @ 5% of 3,00,000 = 15,000</text><text x="114.0" y="574.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.05 114.0 574.0)">Profit for the year = 2,85,000</text><text x="118.3" y="610.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.00 118.3 610.4)">Proposed dividend 1,00,000 in notes to accounts</text><text x="119.8" y="642.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 119.8 642.6)">BS: Share capital 10,00,000; R&amp;S 2,85,000</text><text x="117.9" y="676.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.43 117.9 676.8)">PPE 4,50,000; current assets</text><text x="117.1" y="711.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 117.1 711.5)">Non-current and current items separated</text><text x="112.9" y="778.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 112.9 778.9)">Reserves and profit of S = 2,50,000</text><text x="42.2" y="778.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q9.</text><text x="114.3" y="813.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.06 114.3 813.7)">MI = 20% of 5,00,000 = 1,00,000</text><text x="112.6" y="848.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.34 112.6 848.4)">Goodwill = 5,60,000 − 80% of 5,00,000</text><text x="115.4" y="881.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 115.4 881.1)">   = 1,60,000</text><text x="118.4" y="914.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.39 118.4 914.6)">Stock reduced by 30,000</text><text x="115.1" y="949.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 115.1 949.2)">CBS: Goodwill 1,60,000; MI 1,00,000</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
