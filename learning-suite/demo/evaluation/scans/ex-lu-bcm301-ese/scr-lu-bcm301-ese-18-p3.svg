ns MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.19 120.0 268.3)">Profit 3,60,000 − Tax 60,000 = 3,00,000</text><text x="112.7" y="301.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 112.7 301.6)">MR @ 5% of 3,00,000 = 15,000</text><text x="115.9" y="336.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.05 115.9 336.0)">Profit for the year = 2,85,000</text><text x="119.8" y="370.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 119.8 370.9)">Proposed dividend 1,00,000 in notes to accounts</text><text x="117.0" y="406.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 117.0 406.1)">BS: Share capital 10,00,000; R&amp;S 2,85,000</text><text x="119.2" y="438.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 119.2 438.6)">PPE 4,50,000; current assets</text><text x="114.9" y="474.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.21 114.9 474.5)">Non-current and current items separated</text><text x="117.8" y="540.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.27 117.8 540.2)">Pre-acquisition 1,00,000; post-acq. 1,50,000</text><text x="40.0" y="540.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q9.</text><text x="115.0" y="575.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 115.0 575.6)">MI = 20% of 7,50,000 = 1,50,000</text><text x="113.5" y="608.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.30 113.5 608.1)">Goodwill = 5,60,000 − 4,80,000 = 80,000</text><text x="118.8" y="642.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.27 118.8 642.2)">Unrealised profit = 25% of 30,000 = 7,500</text><text x="117.4" y="676.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 117.4 676.3)">Mutual owing 40,000 cancelled</text><text x="118.2" y="710.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.46 118.2 710.0)">CBS: Goodwill 80,000, MI 1,50,000, stock − 7,500</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
