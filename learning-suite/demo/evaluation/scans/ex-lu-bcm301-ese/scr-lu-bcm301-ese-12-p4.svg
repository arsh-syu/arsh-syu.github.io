 Sans MS, cursive" font-size="21.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.00 113.5 813.1)">Mutual owing 40,000 cancelled</text><text x="117.6" y="846.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 117.6 846.0)">CBS: Goodwill 80,000, MI 1,50,000, stock − 7,500</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
