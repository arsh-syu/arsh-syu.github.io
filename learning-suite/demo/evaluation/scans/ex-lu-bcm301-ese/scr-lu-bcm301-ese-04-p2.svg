 MS, cursive" font-size="22.2" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 115.8 302.8)">(a) Non-current liab. – Long-term borrowings</text><text x="40.2" y="302.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q4.</text><text x="112.0" y="337.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 112.0 337.2)">(b) Current assets – Inventories</text><text x="116.7" y="372.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.07 116.7 372.4)">(c) Current liab. – Trade payables</text><text x="112.4" y="403.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.45 112.4 403.9)">(d) Current liab. – Other current liabilities</text><text x="114.8" y="437.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 114.8 437.8)">(e) Current liab. – Short-term provisions</text><text x="118.8" y="474.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.09 118.8 474.0)">(f) Non-current assets – Intangible assets</text><text x="114.7" y="506.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.31 114.7 506.0)">(g) Current liab. – Other current liabilities</text><text x="116.6" y="539.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 116.6 539.6)">(h) Current liab. – Short-term borrowings</text><text x="114.5" y="609.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.02 114.5 609.3)">Own Debentures A/c Dr 96,000</text><text x="38.1" y="609.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q5.</text><text x="114.3" y="644.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.51 114.3 644.2)">Debenture Interest A/c Dr 10,000</text><text x="112.3" y="676.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 112.3 676.2)">   To Bank A/c 1,06,000</text><text x="113.3" y="709.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.52 113.3 709.9)">10% Debentures Dr 1,00,000</text><text x="112.4" y="745.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.00 112.4 745.0)">   To Own Debentures 96,000, To Profit 4,000</text><text x="115.2" y="779.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.40 115.2 779.6)">Profit on Cancellation Dr 4,000 To Capital Reserve 4,000</text><text x="113.6" y="848.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.48 113.6 848.3)">Total assets 12,50,000 + goodwill 1,00,000</text><text x="39.4" y="848.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1e3a8a">Q6.</text><text x="119.1" y="880.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.46 119.1 880.0)">   = 13,50,000</text><text x="113.0" y="915.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.0" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(0.07 113.0 915.0)">Less liabilities 3,00,000 = 10,50,000</text><text x="115.7" y="948.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.27 115.7 948.8)">Less pref. capital 2,00,000 = 8,50,000</text><text x="117.3" y="982.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1e3a8a" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 117.3 982.5)">Value per share = 8,50,000 ÷ 50,000 = ₹17</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
