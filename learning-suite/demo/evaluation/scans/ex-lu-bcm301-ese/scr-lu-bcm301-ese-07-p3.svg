ce="preserve" style="white-space:pre" transform="rotate(0.28 116.2 268.4)">Profit 3,60,000 − Tax 60,000 = 3,00,000</text><text x="119.9" y="302.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.06 119.9 302.2)">MR @ 5% of 3,00,000 = 15,000</text><text x="112.9" y="335.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.46 112.9 335.9)">Profit for the year = 2,85,000</text><text x="119.4" y="371.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 119.4 371.8)">Proposed dividend 1,00,000 in notes to accounts</text><text x="117.9" y="404.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.18 117.9 404.8)">BS: Share capital 10,00,000; R&amp;S 2,85,000</text><text x="114.2" y="439.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 114.2 439.0)">PPE 4,50,000; current assets</text><text x="117.3" y="474.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.44 117.3 474.5)">Non-current and current items separated</text><text x="117.2" y="540.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.35 117.2 540.8)">Pre-acquisition 1,00,000; post-acq. 1,50,000</text><text x="43.3" y="540.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q9.</text><text x="117.5" y="576.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 117.5 576.1)">MI = 20% of 7,50,000 = 1,50,000</text><text x="118.4" y="608.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.22 118.4 608.7)">Goodwill = 5,60,000 − 4,80,000 = 80,000</text><text x="113.2" y="643.1" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.31 113.2 643.1)">Unrealised profit = 25% of 30,000 = 7,500</text><text x="113.5" y="678.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.12 113.5 678.3)">Mutual owing 40,000 cancelled</text><text x="119.3" y="710.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.2" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.40 119.3 710.2)">CBS: Goodwill 80,000, MI 1,50,000, stock − 7,500</text><rect x="14" y="12" width="822" height="1076" filter="url(#grain)"/>
