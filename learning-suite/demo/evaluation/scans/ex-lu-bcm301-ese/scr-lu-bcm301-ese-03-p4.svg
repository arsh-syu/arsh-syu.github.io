2 117.5 270.4)">Profit 3,60,000 − Tax 60,000 = 3,00,000</text><text x="119.6" y="301.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.33 119.6 301.9)">MR @ 5% of 3,00,000 = 15,000</text><text x="118.3" y="337.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.04 118.3 337.4)">Profit for the year = 2,85,000</text><text x="112.6" y="372.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 112.6 372.2)">Proposed dividend 1,00,000 in notes to accounts</text><text x="112.9" y="406.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.26 112.9 406.3)">BS: Share capital 10,00,000; R&amp;S 2,85,000</text><text x="117.8" y="438.7" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.3" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.45 117.8 438.7)">PPE 4,50,000; current assets</text><text x="117.2" y="473.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.0" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 117.2 473.2)">Non-current and current items separated</text><text x="119.9" y="541.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.2" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 119.9 541.2)">Pre-acquisition 1,00,000; post-acq. 1,50,000</text><text x="41.2" y="541.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight=