,00,000</text><text x="119.6" y="575.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.23 119.6 575.2)">   To Own Debentures 96,000, To Profit 4,000</text><text x="112.1" y="609.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.11 112.1 609.2)">Profit on Cancellation Dr 4,000 To Capital Reserve 4,000</text><text x="117.2" y="677.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.4" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(0.42 117.2 677.6)">Assets 12,00,000 + 1,00,000 = 13,00,000</text><text x="40.6" y="677.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q6.</text><text x="112.0" y="711.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.2" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.49 112.0 711.5)">Less liabilities 3,00,000 = 10,00,000</text><text x="119.4" y="744.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22.1" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.12 119.4 744.0)">Value per share = 10,00,000 ÷ 50,000 = ₹20</text><text x="112.7" y="813.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#1d3a8f" xml:space="preserve" style="white-space:pre" transform="rotate(-0.10 112.7 813.9)">PC = Assets taken over = 9,00,000</text><text x="39.5" y="813.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#1d3a8f">Q7.</text><text x="114.9" y="845.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans M