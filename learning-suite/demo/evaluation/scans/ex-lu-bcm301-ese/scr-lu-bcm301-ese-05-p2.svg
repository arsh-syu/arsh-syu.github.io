 MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.53 119.4 269.6)">Profit 4,000 credited to Statement of P&amp;L</text><text x="119.8" y="337.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.03 119.8 337.3)">Assets 12,00,000 + 1,00,000 = 13,00,000</text><text x="43.2" y="337.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q6.</text><text x="119.5" y="369.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.15 119.5 369.9)">Less liabilities 3,00,000 = 10,00,000</text><text x="113.6" y="406.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.32 113.6 406.5)">Value per share = 10,00,000 ÷ 50,000 = ₹20</text><text x="119.6" y="472.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.14 119.6 472.8)">PC = Assets taken over = 9,00,000</text><text x="40.7" y="472.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q7.</text><text x="116.0" y="506.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.34 116.0 506.2)">Shares = 7,50,000 ÷ 15 = 50,000</text><text x="115.6" y="540.8" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.08 115.6 540.8)"