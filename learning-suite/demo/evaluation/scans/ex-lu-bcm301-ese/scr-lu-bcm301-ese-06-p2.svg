.0" y="268.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.05 118.0 268.6)">Nominal value redeemed       5,00,000</text><text x="117.5" y="303.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.47 117.5 303.5)">Less: proceeds of fresh issue 2,00,000</text><text x="113.8" y="336.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.3" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.48 113.8 336.5)">Transfer to CRR              3,00,000</text><text x="114.3" y="370.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(0.22 114.3 370.0)">General Reserve Dr 3,00,000 To CRR 3,00,000</text><text x="113.7" y="439.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.9" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.53 113.7 439.9)">(a) Non-current liab. – Long-term borrowings</text><text x="39.5" y="439.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#172554">Q4.</text><text x="114.3" y="473.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.1" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.03 114.3 473.9)">(b) Current assets – Inventories</text><text x="116.2" y="508.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#172554" xml:space="preserve" style="white-space:pre" transform="rotate(-0.20 116.2 508.3)">(c) Current liab. – Trade payables</text><text x="113.5" y="540.9" font-family