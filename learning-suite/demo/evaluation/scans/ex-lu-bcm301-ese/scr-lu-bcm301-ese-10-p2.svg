e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.25 114.3 269.8)">Nominal value redeemed       5,00,000</text><text x="114.9" y="302.6" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.19 114.9 302.6)">Less: proceeds of fresh issue 2,00,000</text><text x="115.3" y="337.2" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.5" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.37 115.3 337.2)">Transfer to CRR              3,00,000</text><text x="116.3" y="372.3" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.8" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.17 116.3 372.3)">General Reserve Dr 3,00,000 To CRR 3,00,000</text><text x="113.2" y="440.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.6" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(0.28 113.2 440.0)">(a) Non-current liab. – Long-term borrowings</text><text x="40.1" y="440.0" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="22" font-weight="bold" fill="#22306e">Q4.</text><text x="112.1" y="474.4" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="21.1" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.26 112.1 474.4)">(b) Non-current assets – PPE</text><text x="118.5" y="505.9" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.7" fill="#22306e" xml:space="preserve" style="white-space:pre" transform="rotate(-0.17 118.5 505.9)">(c) Current liab. – Trade payables</text><text x="112.9" y="539.5" font-family="Segoe Print, Ink Free, Bradley Hand, Comic Sans MS, cursive" font-size="20.4" fill="#22306e" xml:space="preserve" style=